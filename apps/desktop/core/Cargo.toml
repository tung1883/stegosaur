[package]
name = "stegosaur-desktop-core"
version = "0.1.0"
edition = "2024"
description = "Operations behind the Stegosaur desktop app, free of any UI toolkit"

[dependencies]
stegosaur = { path = "../../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.9.2"

[dev-dependencies]
tempfile = "3.27.0"
hound = "3.5.1"
