<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stegosaur - merged Hide and Reveal (3 options)</title>
<style>
:root{--bg:#fbf6e6;--card:#fffdf5;--ink:#2e3b2c;--dim:#7a8a74;--line:#e4dcc0;--green:#8fbf5f;--green-d:#5e8f3c;--orange:#ee8a3f;--red:#d2573f;--sky:#d6ecf7}
*{box-sizing:border-box}
body{margin:0;background:#e9e2c8;color:var(--ink);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* option switcher */
.switch{display:flex;gap:10px;justify-content:center;padding:14px 12px 4px;flex-wrap:wrap}
.switch button{border:1.5px solid var(--line);background:#fffa;border-radius:99px;padding:9px 20px;font:inherit;font-weight:600;color:#4a6342;cursor:pointer}
.switch button.on{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 3px 0 #c36d2a}
.blurb{max-width:1180px;margin:6px auto 10px;padding:0 14px;color:#5b6a55;text-align:center;font-size:13px}

/* app frame */
.design{display:none}.design.on{display:block}
.app{width:min(1240px,100% - 24px);height:690px;margin:0 auto 24px;background:var(--bg);border-radius:16px;box-shadow:inset 0 0 0 1px var(--line),0 14px 40px #4a3f1f33;display:grid;grid-template-columns:250px 1fr 350px;grid-template-rows:54px 1fr;gap:12px;padding:0 12px 12px;overflow:hidden}
.top{grid-column:1/4;display:flex;align-items:center;gap:12px;margin:0 -12px;padding:0 20px}
.top img{width:38px;height:38px;border-radius:50%}
.top b{font-size:18px;margin-right:6px}
.chip{padding:6px 15px;border-radius:99px;background:#fff8;color:#4a6342;font-weight:500;cursor:pointer;user-select:none}
.chip.on{background:var(--orange);color:#fff;font-weight:600;box-shadow:0 3px 0 #c36d2a}
.chip.dis{opacity:.55;cursor:default}
.sp{flex:1}
.wc{display:flex;gap:18px;color:var(--dim);padding-right:6px}.wc svg{width:12px;height:12px}

/* left */
.left{background:linear-gradient(#cfe8c4,#b9dca6);border-radius:16px;padding:10px 0;overflow:auto}
.path{padding:0 14px 8px;font-size:12px;color:#4a6342}
.entry{display:flex;align-items:center;gap:9px;margin:2px 10px;padding:7px 9px;border-radius:11px;cursor:pointer;border:1.5px solid transparent}
.entry:hover{background:#fff6}.entry.sel{background:#fff;border-color:var(--green-d)}
.entry .ic{width:18px;color:var(--green-d)}.entry .ic svg{width:18px;height:18px}
.entry .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.entry small{color:#6b7f62;font-size:11.5px}
.entry.k-bin .ic,.entry.k-txt .ic{color:var(--dim)}.entry.k-aud .ic{color:#4f8fb3}.entry.k-log .ic{color:#b8873a}
.tag{font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--green-d);color:#fff;margin-left:4px}.tag.o{background:var(--orange)}.tag.b{background:#4f8fb3}

/* center */
.center{background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.tools{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px dashed var(--line);min-height:50px}
.seg{display:inline-flex;background:#f1ecd4;border-radius:11px;padding:3px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:9px;font:inherit;color:var(--dim);cursor:pointer;font-weight:500}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0002;font-weight:600}
.seg.full{display:flex;width:100%}.seg.full button{flex:1}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto;background:radial-gradient(#fffdf5,#faf3da)}
.legend{padding:8px 14px;border-top:1px dashed var(--line);color:var(--dim);font-size:12.5px;display:flex;gap:16px}
.pic{width:min(100%,560px);aspect-ratio:4/3;border:3px solid #fff;border-radius:12px;box-shadow:0 8px 24px #4a3f1f33;position:relative;overflow:hidden;background:linear-gradient(#97a5b5 0 62%,#5e8359 62%)}
.pic .dino{position:absolute;left:36%;top:50%;width:34%;height:26%;border-radius:50%;background:#e6f1fb;opacity:.85}
.textview{width:min(100%,640px);background:#1f2b24;color:#cfe3c0;border-radius:12px;padding:14px 16px;font:12.5px/1.6 ui-monospace,Consolas,monospace;box-shadow:0 8px 24px #4a3f1f33}
.textview i{color:#8fa597;font-style:normal}
.dropzone{width:min(100%,520px);border:2.5px dashed #cfc59c;border-radius:18px;padding:34px 24px;text-align:center;background:#fffdf5}
.dropzone .big{font-size:18px;font-weight:700}

/* right */
.right{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:auto;padding-bottom:0;position:relative;display:flex;flex-direction:column}
.rbody{flex:1;overflow:auto}
.right h4{margin:16px 16px 6px;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:#6b7f62}
.field{padding:6px 16px}.field label{display:flex;justify-content:space-between;color:var(--dim);font-size:13px;margin-bottom:4px}
.in,select,textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;color:var(--ink)}
textarea{height:78px;resize:none}
input[type=range]{width:100%;accent-color:var(--green-d)}
.slot{margin:5px 16px;padding:8px 11px;border:1.5px dashed var(--line);border-radius:11px;background:#fff}
.slot .t{font-size:12px;color:var(--dim)}.slot .v{display:flex;justify-content:space-between;font-weight:600}.slot.empty .v{color:#a9b3a2;font-weight:400}
.row{display:flex;align-items:center;gap:10px;margin:8px 16px;padding:10px 12px;border-radius:12px;background:#f6f9ee;border:1.5px solid #dfe9cc}
.row .grow{flex:1}.row b{display:block}.row small{color:var(--dim)}
.sw{width:42px;height:24px;border-radius:99px;background:#d8d2b6;position:relative;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:left .2s}
.sw.on{background:var(--green-d)}.sw.on::after{left:21px}
.check{display:flex;gap:8px;align-items:flex-start;margin:6px 16px;color:#5b6a55;font-size:12.5px}.check input{margin-top:3px;accent-color:var(--green-d)}
.help{margin:6px 16px;color:var(--dim);font-size:12.5px}
.meter{padding:4px 16px}.meter .t{display:flex;justify-content:space-between;font-size:13px;color:var(--dim)}
.slots{display:flex;margin:6px 16px;height:26px;border-radius:9px;overflow:hidden;font-size:11.5px;font-weight:600}.slots i{display:flex;align-items:center;justify-content:center;font-style:normal}
.gauge{margin:4px 16px;height:10px;border-radius:99px;background:linear-gradient(90deg,#8fbf5f 0 40%,#f3d36b 40% 70%,#ee8a3f 70%);position:relative}.gauge i{position:absolute;top:-3px;left:8%;width:4px;height:16px;background:var(--ink);border-radius:2px}
.runbar{border-top:1px solid var(--line);padding:10px 16px 14px;background:var(--card)}
.runbar .msg{font-size:12.5px;color:var(--green-d);margin-bottom:6px}
.btn{width:100%;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;font-size:16px;color:#fff;background:var(--orange);box-shadow:0 4px 0 #c36d2a;cursor:pointer}
.link{color:var(--green-d);font-weight:600;cursor:pointer;font-size:12.5px;text-decoration:underline}

/* option B: stepper */
.step{margin:8px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff}
.step.on{border-color:var(--green-d);box-shadow:0 4px 14px #4a6a3a22}
.step .hd{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.step .num{width:26px;height:26px;border-radius:50%;background:#e9e2c8;color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.step.on .num{background:var(--orange);color:#fff}.step.done .num{background:var(--green-d);color:#fff}
.step .num svg{width:14px;height:14px;stroke-width:2.6}
.step .tt{flex:1;font-weight:600}.step .sum{color:var(--dim);font-size:12.5px;font-weight:400}
.step .bd{padding:2px 12px 12px;border-top:1px dashed var(--line)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.card{border:1.5px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:#fffdf5;text-align:left}
.card:hover{border-color:#b9cfa0}.card.on{border-color:var(--green-d);background:#f1f8e8;box-shadow:0 3px 10px #4a6a3a22}
.card b{display:block;margin-bottom:2px}.card small{color:var(--dim);font-size:12px;line-height:1.3;display:block}
.card svg{width:22px;height:22px;color:var(--green-d);margin-bottom:6px}
.next{margin-top:10px;border:0;border-radius:11px;background:var(--green-d);color:#fff;font:inherit;font-weight:600;padding:8px 18px;cursor:pointer}
.review{margin:8px 14px;padding:10px 12px;border-radius:12px;background:#f6f9ee;border:1.5px solid #dfe9cc;font-size:13px}.review div{display:flex;justify-content:space-between;padding:2px 0}.review span:first-child{color:var(--dim)}

/* option C: goal cards */
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:min(100%,760px)}
.goal{border:2px solid var(--line);border-radius:18px;background:#fff;padding:22px 16px;cursor:pointer;text-align:center;transition:transform .15s,box-shadow .2s}
.goal:hover{transform:translateY(-3px);box-shadow:0 10px 22px #4a3f1f22;border-color:var(--green)}
.goal svg{width:42px;height:42px;margin:0 auto 12px;color:var(--green-d)}
.goal b{display:block;font-size:16px;margin-bottom:4px}.goal small{color:var(--dim);display:block;line-height:1.35}
.goal .mini{margin-top:10px;font-size:11.5px;color:#7b8c70;background:#f1f8e8;border-radius:8px;padding:3px 8px;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:7px;background:#f1f8e8;border:1.5px solid #dfe9cc;border-radius:99px;padding:4px 6px 4px 12px;margin:10px 16px 0;font-weight:600}
.pill .link{font-weight:500;padding:0 6px}
.badge{display:inline-flex;align-items:center;gap:7px;background:#f1f8e8;border:1.5px solid var(--green);border-radius:99px;padding:5px 14px;font-weight:600;color:#3d6a22}
.badge svg{width:16px;height:16px}
.note{position:fixed;left:14px;bottom:12px;max-width:300px;z-index:5;background:#2e3b2c;color:#fff;border-radius:12px;padding:10px 14px;font-size:12.5px;opacity:.94}
</style>
</head>
<body>
<div class="switch">
  <button data-d="A" class="on">Option A - One form</button>
  <button data-d="B">Option B - Guided steps</button>
  <button data-d="C">Option C - Pick a goal first</button>
</div>
<div class="blurb" id="blurb"></div>
<div class="design on" id="dA"></div>
<div class="design" id="dB"></div>
<div class="design" id="dC"></div>
<div class="note" id="note">Click around: switch the tabs, the cover type, the second-file switch, and the files on the left.</div>

<script>
const BLURB = {
  A: 'Closest to today. One form that adapts: a cover-type switch at the top, a switch for the optional second file, and everything else stays in place. Fewest clicks for people who already know the app.',
  B: 'Walks you through it: where to hide, what to hide, passphrase, review. Each answer collapses into a one-line summary. Slowest for experts, clearest for newcomers.',
  C: 'Starts by asking what you want to do (hide one file, hide two files, hide a message in text). The screen then shows only what that goal needs. Reveal becomes a single drop target that detects what you gave it.'
};
const svg = (d) => '<svg viewBox="0 0 24 24" aria-hidden="true">' + d + '</svg>';
const I = {
  folder: svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),
  image: svg('<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/>'),
  audio: svg('<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>'),
  file: svg('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>'),
  text: svg('<path d="M5 6h14M5 10h14M5 14h9M5 18h12"/>'),
  files2: svg('<path d="M8 3h7l4 4v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M4 8v11a2 2 0 0 0 2 2h9"/>'),
  check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  min: svg('<path d="M3 12h18"/>'), max: svg('<rect x="5" y="5" width="14" height="14" rx="2"/>'), x: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
};
const FILES = [
  { n: 'beach.png', k: 'img', ic: 'image', s: '1024x768' }, { n: 'beach.stego.png', k: 'img', ic: 'image', s: '1024x768', stego: 1 },
  { n: 'cover.log', k: 'log', ic: 'text', s: '2 KB', text: 1 }, { n: 'notes.txt', k: 'txt', ic: 'file', s: '34 B' },
  { n: 'report.bin', k: 'bin', ic: 'file', s: '29 KB' }, { n: 'secret.bin', k: 'bin', ic: 'file', s: '200 B' },
  { n: 'song.flac', k: 'aud', ic: 'audio', s: '44.1 kHz' }, { n: 'tower.jpg', k: 'img', ic: 'image', s: '512x512 JPEG' },
];
const STYLES = ['syslog', 'nginx', 'postgres', 'env', 'prose'];

// ---------- shared pieces ----------
const topbar = (S, tabs) => `<div class="top"><img src="../apps/desktop/ui/icon.png" alt=""><b>Stegosaur</b>` +
  tabs.map(([id, l, live]) => `<span class="chip ${S.tab === id ? 'on' : ''} ${live ? '' : 'dis'}" ${live ? `data-set="tab=${id}"` : ''}>${l}</span>`).join('') +
  `<span class="sp"></span><span class="wc">${I.min}${I.max}${I.x}</span></div>`;

function left(S) {
  const sel = (f) => (S.tab === 'hide' ? [S.cover, S.payload, S.payload2].includes(f.n) : S.rev === f.n);
  return `<aside class="left"><div class="path">C:\\Users\\you\\Pictures</div>` + FILES.map((f) => {
    const tag = S.tab === 'hide' ? (f.n === S.cover ? '<span class="tag">cover</span>' : f.n === S.payload ? '<span class="tag o">hide</span>' : f.n === S.payload2 ? '<span class="tag b">2nd</span>' : '') : (f.stego ? '<span class="tag">stego</span>' : '');
    return `<div class="entry k-${f.k} ${sel(f) ? 'sel' : ''}" data-pick="${f.n}"><span class="ic">${I[f.ic]}</span><span class="nm">${f.n}</span>${tag}<small>${f.s}</small></div>`;
  }).join('') + '</aside>';
}

const pic = () => '<div class="pic"><div class="dino"></div></div>';
const LOG = ['Nov 19 08:14:02 web01 sshd[4121]: Accepted publickey for deploy from 10.0.4.17 port 51322', 'Nov 19 08:14:03 web01 sshd[4121]: pam_unix(sshd:session): session opened for user deploy', 'Nov 19 08:14:09 web01 CRON[4177]: (root) CMD (/usr/lib/php/sessionclean)', 'Nov 19 08:15:01 web01 systemd[1]: Started Daily apt download activities.', 'Nov 19 08:15:44 web01 kernel: eth0: link up, 1000 Mbps, full-duplex'];
const textview = () => '<div class="textview">' + LOG.map((l) => '<div>' + l.replace(/^(\S+ \d+ [\d:]+)/, '<i>$1</i>') + '</div>').join('') + '</div>';

function centerHide(S) {
  const text = S.cover === 'text';
  const tools = text ? '<b>Cover text</b><span class="sp"></span><span style="color:var(--dim)">36 lines - 460 words</span>'
    : '<div class="seg"><button class="on">Stego</button><button>Original</button><button>Difference</button><button>LSB plane</button></div><span class="sp"></span><span style="color:var(--dim)">changed 3.2% of samples (preview)</span>';
  return `<section class="center"><div class="tools">${tools}</div><div class="stage">${text ? textview() : pic()}</div><div class="legend">${text ? 'The text hides your message. Keep the style and realism to read it back.' : 'orange = changed  -  hover for pixel values'}</div></section>`;
}

const capFile = (S) => `<div class="slots"><i style="flex:0 0 ${S.second || S.twoSlot ? 22 : 44}%;background:#8fbf5f;color:#2e4a1c">${S.second || S.twoSlot ? '9 KB' : '29 KB'}</i><i style="flex:1;background:#ebe4c8;color:var(--dim)">${S.second || S.twoSlot ? '30 KB free per slot' : '12 KB free'}</i></div>
  <div class="meter"><div class="t"><span>${S.second || S.twoSlot ? 'each slot holds' : 'capacity'} (1024x768)</span><b>${S.second || S.twoSlot ? '39 KB' : '41 KB'}</b></div></div>
  <div class="gauge"><i></i></div><div class="meter"><div class="t"><span>Hard to spot</span><span>Easy to spot</span></div></div>`;
const capText = () => `<div class="meter"><div class="t"><span>capacity</span><b>2.4 bits/word</b></div></div><div class="meter"><div class="t"><span>well-formed lines</span><b>97%</b></div></div><div class="meter"><div class="t"><span>this message becomes</span><b>~460 words / 36 lines</b></div></div><div class="help">Text carries a few hundred bytes. Good for passwords and short notes, not files.</div>`;

const slot = (label, name, size) => `<div class="slot ${name ? '' : 'empty'}"><div class="t">${label}</div><div class="v"><span>${name || 'click a file on the left'}</span><span style="color:var(--dim);font-weight:400">${size || ''}</span></div></div>`;
const pass = (label, S, key) => `<div class="field"><label>${label}<b>${S[key] ? (S[key].length < 8 ? 'weak' : 'strong') : ''}</b></label><input class="in" type="password" data-bind="${key}" value="${S[key] || ''}"></div>`;
const textFields = (S, withMsg) => `<div class="field"><label>Style</label><select data-bind="style">${STYLES.map((s) => `<option ${S.style === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
  <div class="field"><label>Realism (context order) <b>${S.order}</b></label><input type="range" min="1" max="6" value="${S.order}" data-bind="order"></div>` +
  (withMsg ? `<div class="field"><label>Message</label><textarea data-bind="msg" placeholder="type what to hide">${S.msg || ''}</textarea></div>` : '');
const runbar = (msg, label, ready = true) => `<div class="runbar"><div class="msg">${msg}</div><button class="btn" ${ready ? '' : 'style="opacity:.5"'}>${label}</button></div>`;
const fileSize = (n) => (FILES.find((f) => f.n === n) || {}).s;

function layoutLabel(S) {
  if (S.cover === 'text') return ['Ready.', 'Generate text'];
  if (S.second) return ['Ready. Each passphrase opens only its own file.', 'Hide both'];
  return ['Ready.', 'Hide it'];
}

// ---------- OPTION A: one form ----------
function renderA(S) {
  const tabs = [['hide', 'Hide', 1], ['reveal', 'Reveal', 1], ['analyze', 'Analyze', 0], ['split', 'Split / Join', 0]];
  let right;
  if (S.tab === 'hide') {
    const file = S.cover === 'file';
    const [msg, label] = layoutLabel(S);
    right = `<div class="rbody"><h4>Hide it in</h4><div class="field"><div class="seg full" ><button class="${file ? 'on' : ''}" data-set="cover=file">Image or audio</button><button class="${file ? '' : 'on'}" data-set="cover=text">Generated text</button></div></div>`;
    if (file) {
      right += `<h4>Files</h4>${slot('Cover', S.cover === 'file' ? S.coverFile || 'beach.png' : '', fileSize(S.coverFile || 'beach.png'))}${slot('File to hide', S.payload, fileSize(S.payload))}
        <div class="row"><div class="grow"><b>Also hide a second file</b><small>It gets its own passphrase. Each one opens only its own file.</small></div><div class="sw ${S.second ? 'on' : ''}" data-toggle="second"></div></div>`;
      if (S.second) right += slot('Second file', S.payload2, fileSize(S.payload2));
      else right += `<label class="check"><input type="checkbox" data-bind="twoSlot" ${S.twoSlot ? 'checked' : ''}><span>Look the same whether or not a second file is hidden <span class="link" data-set="note=twoslot">(what is this?)</span></span></label>`;
      right += `<h4>Passphrase</h4>${pass(S.second ? 'First passphrase' : 'Passphrase', S, 'p1')}${S.second ? pass('Second passphrase', S, 'p2') : ''}<h4>Preview</h4>${capFile(S)}<h4>Settings</h4>
        <div class="field"><label>Mode</label><div class="seg full"><button class="on">match (recommended)</button><button>replace</button></div></div>
        <div class="field"><label>Error correction <b>16 bytes</b></label><input type="range" value="16"></div>
        ${S.second || S.twoSlot ? '<div class="field"><label>Slot size <b>10 %</b></label><input type="range" value="10"></div>' : ''}</div>`;
    } else {
      right += `<h4>Message</h4>${textFields(S, true)}<h4>Passphrase</h4>${pass('Passphrase', S, 'p1')}<h4>Preview</h4>${capText()}</div>`;
    }
    right += runbar(msg, label);
  } else {
    const isText = S.rev === 'cover.log';
    right = `<div class="rbody"><h4>Read from</h4>${slot(isText ? 'Text file' : 'Image or audio file', S.rev, fileSize(S.rev))}
      <div class="help">${isText ? 'This looks like cover text, so the style settings are shown. Use the same ones used to hide it.' : 'Tries the normal layout, then the two-passphrase layout.'}</div>
      <h4>Passphrase</h4>${pass('Passphrase', S, 'p1')}${isText ? `<h4>Text settings</h4>${textFields(S, false)}` : '<h4>Settings</h4><div class="field"><label>Error correction <b>16 bytes</b></label><input type="range" value="16"></div>'}
      <h4>Save as</h4><div class="field"><input class="in" placeholder="auto: ${(S.rev || 'file').replace(/\.[^.]+$/, '')}.recovered.bin"></div></div>` + runbar('Ready.', 'Recover');
  }
  return `<div class="app">${topbar(S, tabs)}${left(S)}${S.tab === 'hide' ? centerHide(S) : centerReveal(S)}<aside class="right">${right}</aside></div>`;
}

function centerReveal(S) {
  const text = S.rev === 'cover.log';
  return `<section class="center"><div class="tools"><b>${S.rev || 'Nothing chosen'}</b><span class="sp"></span>${S.rev ? `<span class="badge">${I.check}${text ? 'Looks like cover text' : 'Looks like an image'}</span>` : ''}</div><div class="stage">${text ? textview() : pic()}</div><div class="legend">${text ? 'Recovers a short hidden message.' : 'Recovers the hidden file and saves it next to the image.'}</div></section>`;
}

// ---------- OPTION B: guided steps ----------
function renderB(S) {
  const tabs = [['hide', 'Hide', 1], ['reveal', 'Reveal', 1], ['analyze', 'Analyze', 0], ['split', 'Split / Join', 0]];
  const step = S.step;
  const file = S.cover === 'file';
  const done = (n) => n < step;
  const head = (n, title, sum) => `<div class="hd" data-set="step=${n}"><span class="num">${done(n) ? I.check : n}</span><span class="tt">${title}<div class="sum">${done(n) || step === n ? '' : ''}${done(n) ? sum : ''}</div></span></div>`;
  let h = '<div class="rbody" style="padding-top:8px">';
  if (S.tab === 'hide') {
    const sums = [file ? 'An image or audio file' : 'Generated text', file ? (S.second ? 'Two files, two passphrases' : 'One file') : 'A typed message', 'Set', ''];
    h += `<div class="step ${step === 1 ? 'on' : ''} ${done(1) ? 'done' : ''}">${head(1, 'Where should it hide?', sums[0])}${step === 1 ? `<div class="bd"><div class="cards"><div class="card ${file ? 'on' : ''}" data-set="cover=file">${I.image}<b>In a file</b><small>Image or audio. Holds the most.</small></div><div class="card ${file ? '' : 'on'}" data-set="cover=text">${I.text}<b>In text</b><small>Looks like a log. Short messages only.</small></div></div><button class="next" data-set="step=2">Next</button></div>` : ''}</div>`;
    h += `<div class="step ${step === 2 ? 'on' : ''} ${done(2) ? 'done' : ''}">${head(2, 'What are you hiding?', sums[1])}${step === 2 ? `<div class="bd">` + (file ? `<div class="cards"><div class="card ${S.second ? '' : 'on'}" data-set="second=0">${I.file}<b>One file</b><small>Uses the whole cover.</small></div><div class="card ${S.second ? 'on' : ''}" data-set="second=1">${I.files2}<b>Two files</b><small>Each has its own passphrase.</small></div></div><div style="margin-top:10px">${slot('Cover', S.coverFile || 'beach.png', fileSize(S.coverFile || 'beach.png'))}</div>${slot('File to hide', S.payload, fileSize(S.payload))}${S.second ? slot('Second file', S.payload2, fileSize(S.payload2)) : ''}` : textFields(S, true)) + `<button class="next" data-set="step=3">Next</button></div>` : ''}</div>`;
    h += `<div class="step ${step === 3 ? 'on' : ''} ${done(3) ? 'done' : ''}">${head(3, S.second ? 'Choose two passphrases' : 'Choose a passphrase', sums[2])}${step === 3 ? `<div class="bd" style="margin:0 -4px">${pass(S.second ? 'First passphrase' : 'Passphrase', S, 'p1')}${S.second ? pass('Second passphrase', S, 'p2') : ''}<div style="padding:0 16px"><button class="next" data-set="step=4">Next</button></div></div>` : ''}</div>`;
    h += `<div class="step ${step === 4 ? 'on' : ''}">${head(4, 'Check and hide', '')}${step === 4 ? `<div class="bd"><div class="review" style="margin:10px 0"><div><span>Where</span><span>${file ? S.coverFile || 'beach.png' : 'generated ' + S.style + ' text'}</span></div><div><span>Hiding</span><span>${file ? (S.second ? (S.payload || '?') + ' + ' + (S.payload2 || '?') : S.payload || '?') : 'your message'}</span></div><div><span>${file ? 'Capacity' : 'Becomes'}</span><span>${file ? (S.second ? '39 KB per slot' : '41 KB') : '~36 lines'}</span></div><div><span>Looks like</span><span>${file ? 'Low risk' : '97% well-formed'}</span></div></div></div>` : ''}</div></div>`;
    h += runbar(step === 4 ? 'Everything is ready.' : 'Finish the steps above.', file ? (S.second ? 'Hide both' : 'Hide it') : 'Generate text', step === 4);
  } else {
    const isText = S.rev === 'cover.log';
    const rs = S.rstep;
    h += `<div class="step ${rs === 1 ? 'on' : ''} ${rs > 1 ? 'done' : ''}"><div class="hd" data-set="rstep=1"><span class="num">${rs > 1 ? I.check : 1}</span><span class="tt">What do you want to read?<div class="sum">${rs > 1 ? S.rev : ''}</div></span></div>${rs === 1 ? `<div class="bd">${slot(isText ? 'Text file' : 'Image or audio file', S.rev, fileSize(S.rev))}<div class="help" style="margin:8px 0">${S.rev ? `<span class="badge">${I.check}${isText ? 'Looks like cover text' : 'Looks like an image'}</span>` : 'Pick a file on the left.'}</div><button class="next" data-set="rstep=2">Next</button></div>` : ''}</div>`;
    h += `<div class="step ${rs === 2 ? 'on' : ''}"><div class="hd" data-set="rstep=2"><span class="num">2</span><span class="tt">Passphrase${isText ? ' and text settings' : ''}</span></div>${rs === 2 ? `<div class="bd" style="margin:0 -4px">${pass('Passphrase', S, 'p1')}${isText ? textFields(S, false) : ''}</div>` : ''}</div></div>`;
    h += runbar('Ready.', 'Recover', rs === 2);
  }
  return `<div class="app">${topbar(S, tabs)}${left(S)}${S.tab === 'hide' ? centerHide(S) : centerReveal(S)}<aside class="right">${h}</aside></div>`;
}

// ---------- OPTION C: pick a goal first ----------
function renderC(S) {
  const tabs = [['hide', 'Hide', 1], ['reveal', 'Reveal', 1], ['analyze', 'Analyze', 0], ['split', 'Split / Join', 0]];
  const goals = { one: ['Hiding one file', 'In an image or audio file'], two: ['Hiding two files', 'Two passphrases, one cover'], text: ['Hiding a message', 'In generated text'] };
  let center, right;
  if (S.tab === 'hide') {
    if (!S.goal) {
      center = `<section class="center"><div class="tools"><b>What do you want to do?</b></div><div class="stage"><div class="goals">
        <div class="goal" data-set="goal=one;cover=file;second=0">${I.file}<b>Hide a file</b><small>Put any file inside an image or audio file.</small><span class="mini">holds the most</span></div>
        <div class="goal" data-set="goal=two;cover=file;second=1">${I.files2}<b>Hide two files</b><small>Two files, two passphrases, one cover. Each passphrase opens only its own file.</small><span class="mini">one is the public file</span></div>
        <div class="goal" data-set="goal=text;cover=text;second=0">${I.text}<b>Hide a message</b><small>Turn a short secret into normal-looking log text you can paste anywhere.</small><span class="mini">survives copy and paste</span></div></div></div><div class="legend">You can change your mind at any time.</div></section>`;
      right = '<div class="rbody"><div class="help" style="margin-top:26px">Choose what you want to do in the middle. This panel will then show only the settings that goal needs.</div></div>';
    } else {
      S.cover = S.goal === 'text' ? 'text' : 'file';
      center = centerHide(S);
      const [msg, label] = layoutLabel(S);
      right = `<div class="pill">${goals[S.goal][0]}<span class="link" data-set="goal=">change</span></div><div class="rbody">`;
      if (S.goal === 'text') right += `<h4>Message</h4>${textFields(S, true)}<h4>Passphrase</h4>${pass('Passphrase', S, 'p1')}<h4>Preview</h4>${capText()}`;
      else right += `<h4>Files</h4>${slot('Cover', S.coverFile || 'beach.png', fileSize(S.coverFile || 'beach.png'))}${slot(S.goal === 'two' ? 'Public file' : 'File to hide', S.payload, fileSize(S.payload))}${S.goal === 'two' ? slot('Hidden file', S.payload2, fileSize(S.payload2)) : ''}
        <h4>Passphrase${S.goal === 'two' ? 's' : ''}</h4>${pass(S.goal === 'two' ? 'Public passphrase' : 'Passphrase', S, 'p1')}${S.goal === 'two' ? pass('Hidden passphrase', S, 'p2') : ''}<h4>Preview</h4>${capFile({ ...S, second: S.goal === 'two' })}
        <h4>Settings</h4><div class="field"><label>Error correction <b>16 bytes</b></label><input type="range" value="16"></div>${S.goal === 'two' ? '<div class="field"><label>Slot size <b>10 %</b></label><input type="range" value="10"></div>' : ''}`;
      right += '</div>' + runbar(msg, S.goal === 'two' ? 'Hide both' : label);
    }
  } else {
    const isText = S.rev === 'cover.log';
    center = `<section class="center"><div class="tools"><b>Recover a hidden file or message</b></div><div class="stage">${S.rev ? (isText ? textview() : pic()) : `<div class="dropzone"><div class="big">Drop a file here</div><div style="color:var(--dim);margin-top:6px">or pick one on the left. An image, audio, JPEG or text file works - Stegosaur works out which.</div></div>`}</div><div class="legend">${S.rev ? 'Detected automatically.' : 'No settings to choose first.'}</div></section>`;
    right = `<div class="rbody">${S.rev ? `<div class="pill" style="margin-top:14px">${S.rev}<span class="badge" style="margin-left:6px;padding:2px 10px">${isText ? 'cover text' : 'image'}</span></div>` : ''}<h4>Passphrase</h4>${pass('Passphrase', S, 'p1')}${isText ? `<h4>Text settings</h4>${textFields(S, false)}<div class="help">Cover text does not record its style, so enter the same one used to hide it.</div>` : ''}</div>` + runbar(S.rev ? 'Ready.' : 'Choose a file first.', 'Recover', !!S.rev);
  }
  return `<div class="app">${topbar(S, tabs)}${left(S)}${center}<aside class="right">${right}</aside></div>`;
}

// ---------- tiny state + event layer ----------
function mount(id, render, S) {
  const el = document.getElementById(id);
  const draw = () => {
    const keep = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.bind : null;
    el.innerHTML = render(S);
    if (keep) { const e = el.querySelector(`[data-bind="${keep}"]`); if (e && e.type !== 'range') { e.focus(); const v = e.value; e.value = ''; e.value = v; } }
  };
  el.addEventListener('click', (e) => {
    const set = e.target.closest('[data-set]');
    if (set) {
      set.dataset.set.split(';').forEach((kv) => { const [k, v] = kv.split('='); if (k === 'note') { toast('Normally a cover holding one file reveals that a payload exists. With this on, the layout is the same either way, so a cover with one file looks identical to one with two.'); return; } if (k === 'step' || k === 'rstep') S[k] = +v; else S[k] = v === '1' ? true : v === '0' ? false : v; if (k === 'goal' && v === '') S.goal = null; });
      if (S.tab) { if (S.tab === 'reveal' && !S.rev) S.rev = 'beach.stego.png'; }
      draw(); return;
    }
    const tg = e.target.closest('[data-toggle]');
    if (tg) { S[tg.dataset.toggle] = !S[tg.dataset.toggle]; draw(); return; }
    const pk = e.target.closest('[data-pick]');
    if (pk) {
      const f = FILES.find((x) => x.n === pk.dataset.pick);
      if (S.tab === 'reveal') S.rev = f.n;
      else if (f.k === 'img' || f.k === 'aud') S.coverFile = f.n, S.cover = S.cover === 'text' ? 'text' : 'file';
      else if (!S.payload || S.payload === f.n) S.payload = f.n;
      else if (S.second || S.goal === 'two') S.payload2 = f.n;
      else S.payload = f.n;
      if (S.coverFile) S.cover = S.cover || 'file';
      if (S.tab === 'hide') S.cover = S.goal === 'text' || S.cover === 'text' ? 'text' : 'file';
      draw();
    }
  });
  el.addEventListener('input', (e) => {
    const b = e.target.dataset && e.target.dataset.bind;
    if (!b) return;
    S[b] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    if (b === 'p1' || b === 'p2' || b === 'msg' || b === 'order' || b === 'style' || b === 'twoSlot') { if (e.target.type !== 'range' && b !== 'style') { const lbl = e.target.closest('.field') && e.target.closest('.field').querySelector('label b'); if (lbl && (b === 'p1' || b === 'p2')) lbl.textContent = e.target.value ? (e.target.value.length < 8 ? 'weak' : 'strong') : ''; return; } draw(); }
  });
  draw();
}
const base = () => ({ tab: 'hide', cover: 'file', second: false, twoSlot: false, coverFile: 'beach.png', payload: 'report.bin', payload2: '', rev: 'beach.stego.png', style: 'syslog', order: 4, msg: '', p1: '', p2: '' });
mount('dA', renderA, base());
mount('dB', renderB, { ...base(), step: 1, rstep: 1 });
mount('dC', renderC, { ...base(), goal: null });

document.querySelectorAll('.switch button').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('.switch button').forEach((x) => x.classList.toggle('on', x === b));
  ['A', 'B', 'C'].forEach((k) => document.getElementById('d' + k).classList.toggle('on', k === b.dataset.d));
  document.getElementById('blurb').textContent = BLURB[b.dataset.d];
}));
document.getElementById('blurb').textContent = BLURB.A;
function toast(t) { const n = document.getElementById('note'); n.textContent = t; clearTimeout(toast.h); toast.h = setTimeout(() => (n.textContent = 'Click around: switch the tabs, the cover type, the second-file switch, and the files on the left.'), 6000); }
if (location.hash) { const k = location.hash.slice(1, 2).toUpperCase(); const b = document.querySelector(`.switch button[data-d="${k}"]`); if (b) b.click(); }
</script>
</body>
</html>
