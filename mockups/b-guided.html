<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stegosaur guided mockup</title>
<style>
  :root{--bg:#fbf6e6;--card:#fffdf5;--ink:#2e3b2c;--dim:#7a8a74;--line:#e4dcc0;--green:#8fbf5f;--green-d:#5e8f3c;--orange:#ee8a3f;--sky:#d6ecf7;--red:#d2573f}
  *{box-sizing:border-box}
  body{margin:0;background:#e9e2c8;font:15px/1.45 system-ui,"Segoe UI",sans-serif;color:var(--ink);padding:20px 12px}
  .note{max-width:1040px;margin:0 auto 12px;color:#6b6a50;font-size:12px}
  .win{max-width:1040px;margin:0 auto;background:var(--bg);border-radius:14px;overflow:hidden;box-shadow:0 14px 40px #4a3f1f33;display:grid;grid-template-columns:230px 1fr;min-height:660px}
  .rail{background:linear-gradient(#cfe8c4,#b9dca6);padding:18px 14px;display:flex;flex-direction:column;gap:6px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .brand img{width:46px;height:46px;border-radius:50%}
  .brand b{font-size:19px;letter-spacing:.2px}
  .mode{padding:9px 12px;border-radius:10px;cursor:pointer;color:#35502e;display:flex;gap:10px;align-items:center;user-select:none}
  .mode:hover{background:#ffffff66}
  .mode.on{background:#fff;box-shadow:0 2px 6px #0001;font-weight:600}
  .mode span{font-size:18px;width:22px;text-align:center}
  .main{padding:26px 34px 22px;display:flex;flex-direction:column;min-width:0}
  .steps{display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:13px;color:var(--dim);flex-wrap:wrap}
  .st{display:flex;align-items:center;gap:7px;white-space:nowrap}
  .st i{width:24px;height:24px;border-radius:50%;background:#e4dcc0;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;color:#fff}
  .st.done i{background:var(--green)} .st.now i{background:var(--orange)} .st.now{color:var(--ink);font-weight:600}
  .bar{flex:1;height:2px;background:var(--line);min-width:12px}
  h1{font-size:24px;margin:0 0 4px} .sub{color:var(--dim);margin:0 0 18px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
  .pick{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:.12s}
  .pick:hover{border-color:#c9d8b5} .pick.on{border-color:var(--green-d);background:#f1f8e8}
  .pick.off{opacity:.5;cursor:not-allowed;filter:grayscale(.6)}
  .pick small{color:var(--dim)} .pick b{word-break:break-all}
  .thumb{aspect-ratio:16/9;border-radius:9px;display:grid;place-items:center;font-size:26px}
  .t1{background:linear-gradient(#bfe3f5 60%,#a8cf82 60%)} .t2{background:linear-gradient(135deg,#d99a6c,#7a6a4a)} .t3{background:linear-gradient(135deg,#6fa56a,#2f5a3a)} .t4{background:linear-gradient(135deg,#6c88a8,#3b4d66)} .t5{background:#ddd}
  .badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600}
  .ok{background:#e2f2d2;color:#3f6b25} .warn{background:#fde8cf;color:#9a5412} .bad{background:#f9d9d2;color:#9a2f1c}
  .opt{display:flex;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:8px;cursor:pointer;background:#fff}
  .opt.on{border-color:var(--green-d);background:#f1f8e8}
  .opt b{display:block} .opt small{color:var(--dim)}
  .radio{width:18px;height:18px;border-radius:50%;border:2px solid #c5bd9c;margin-top:2px;flex:none}
  .opt.on .radio{border-color:var(--green-d);background:radial-gradient(var(--green-d) 45%,#fff 50%)}
  .toggle{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer;gap:10px}
  .toggle:last-child{border:none}
  .sw{width:42px;height:24px;border-radius:12px;background:#d8d1b2;position:relative;flex:none}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
  .sw.on{background:var(--green-d)} .sw.on::after{left:21px}
  .preview{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .img{aspect-ratio:4/3;border-radius:10px;border:1px solid var(--line);position:relative;overflow:hidden}
  .img .cap{position:absolute;left:8px;top:8px;background:#fffd;border-radius:6px;padding:1px 8px;font-size:12px}
  .gauge{height:14px;border-radius:7px;background:linear-gradient(90deg,#9bd06a 0 40%,#f3d36b 40% 70%,#ee8a3f 70% 100%);position:relative;margin:10px 0 6px}
  .gauge i{position:absolute;top:-5px;width:6px;height:24px;border-radius:3px;background:#2e3b2c;border:2px solid #fff;transition:left .4s}
  .row{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);gap:8px}
  .meter{height:10px;background:#ebe4c8;border-radius:5px;overflow:hidden;margin:8px 0 4px}
  .meter i{display:block;height:100%;background:var(--green);transition:width .3s}
  .meter.red i{background:var(--red)}
  .actions{margin-top:auto;padding-top:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .btn{padding:11px 22px;border-radius:11px;border:none;font:600 15px system-ui;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--dim)} .btn.ghost:hover{color:var(--ink)}
  .btn.go{background:var(--orange);color:#fff;box-shadow:0 3px 0 #c36d2a}
  .btn.go[disabled]{background:#d8d1b2;box-shadow:0 3px 0 #bdb590;cursor:not-allowed}
  .btn.alt{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .hint{font-size:13px;color:#9a5412;min-height:20px}
  .tip{font-size:13px;color:#6b7a5f;background:var(--sky);padding:9px 12px;border-radius:10px;margin-top:10px}
  input[type=text],input[type=password],textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  textarea{min-height:110px;resize:vertical} input:focus,textarea:focus{outline:2px solid #bfe0a2;border-color:var(--green-d)}
  label.l{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
  input[type=range]{width:100%;accent-color:var(--green-d)}
  .code{background:#1f2b24;color:#cfe3c0;border-radius:10px;padding:12px 14px;font:12px/1.5 ui-monospace,Consolas,monospace;overflow:auto;max-height:260px;white-space:pre}
  .prog{height:14px;border-radius:7px;background:#ebe4c8;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--green-d);transition:width .35s}
  .done-card{text-align:center;padding:10px 0 4px} .done-card .big{font-size:44px}
  table.sum{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px} table.sum td{padding:6px 0;border-bottom:1px dashed var(--line)} table.sum td:first-child{color:var(--dim);width:38%}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2e3b2c;color:#fff;padding:9px 18px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none}
  .toast.on{opacity:1}
  .drop{border:2px dashed #cdbf8f;border-radius:14px;padding:18px;text-align:center;color:var(--dim);cursor:pointer;margin-bottom:12px;background:#fffdf0}
  .drop:hover{border-color:var(--green-d);color:var(--ink)}
  @media(max-width:820px){.win{grid-template-columns:1fr}.rail{flex-direction:row;flex-wrap:wrap}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<p class="note">Option B - Guided desktop app (wizard). Fully clickable: pick a task on the left and walk through it. Next stays disabled until a step is valid. Capacity uses the real formulas; "how hidden" is an illustrative model; cover-text lines are real tool output.</p>
<div class="win">
  <aside class="rail" id="rail"></aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script src="samples.js"></script>
<script>
// ---------- data and real formulas ----------
const CAR=[
  {n:'beach.png',dim:'1024x768',samples:1024*768*3,th:'t1',ic:'🏖'},
  {n:'city.png',dim:'2048x1365',samples:2048*1365*3,th:'t2',ic:'🏙'},
  {n:'forest.bmp',dim:'800x600',samples:800*600*3,th:'t3',ic:'🌲'},
  {n:'voice.wav',dim:'44.1 kHz audio',samples:1500000,th:'t4',ic:'🎙'},
  {n:'photo.jpg',dim:'JPEG',samples:0,th:'t5',ic:'📷',bad:true}
];
const PAY=[{n:'notes.txt',size:4096,ic:'📄'},{n:'report.pdf',size:225280,ic:'📕'},{n:'keys.zip',size:18432,ic:'🗜'},{n:'archive.tar',size:1288490,ic:'📦'}];
const ANA=[{n:'beach.png',how:'original image',rs:.003,spa:.001},{n:'beach.stego.png',how:'hidden with Stealthy',rs:.012,spa:.004},{n:'beach.replace.png',how:'hidden with Quick',rs:.762,spa:.744},{n:'city.stego.png',how:'hidden with Stealthy, small file',rs:.004,spa:.002}];
const STY={prose:'English sentences',syslog:'Linux system log',postgres:'PostgreSQL log',nginx:'Web server log',env:'Config file with secrets'};
const BPW={prose:[2.59],syslog:[1.83,1.35,1.09,.85,.60,.42],postgres:[1.78,1.48,1.06,.84,.58,.47],nginx:[1.62,1.30,1.24,1.14,.87,.49],env:[.57]};
const WELL={syslog:[31,75,87,95,100,100],postgres:[80,100,100,100,100,100],nginx:[11,100,100,100,100,100]};
const WPL={prose:14,syslog:14,postgres:15,nginx:20,env:1.2},ODEF={syslog:4,postgres:2,nginx:2};
const wireAvail=(a,p)=>{if(!p)return a;const f=Math.floor(a/255),r=a%255;return f*(255-p)+Math.max(0,r-p)};
const singleCap=(s,p)=>Math.max(0,wireAvail(Math.max(0,Math.floor(s/8)-4-(p||0)),p)-28);
const slotCap=(s,rate,p)=>{const reg=Math.floor(s/2),slot=Math.min(Math.floor(reg*rate/8),Math.floor(reg/8));return Math.max(0,wireAvail(slot,p)-32)};
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+' MB':n>=1024?((n/1024)>=100?Math.round(n/1024):(n/1024).toFixed(1))+' KB':n+' B';
const detect=(fill,quick)=>{const rs=quick?Math.min(1,fill):.004+.02*fill,spa=quick?Math.min(1,fill*.98):.002+.01*fill,score=Math.round(100*Math.max(rs,spa));return{rs,spa,score,risk:score<5?'low':score<20?'mid':'high'}};
const RISK={low:['Hard to spot','ok'],mid:['Might be spotted','warn'],high:['Easy to spot','bad']};
const gaugePos=sc=>sc<5?5+sc*2:sc<20?40+(sc-5)*2:Math.min(95,70+(sc-20)*.4);
const strength=p=>p.length<8?['weak',.25]:p.length<14?['okay',.6]:['strong',1];
// ---------- state ----------
const FLOWS={hide:['What to hide','Cover image','Protect it','Save'],two:['Hidden file','Public file','Cover image','Passphrases','Save'],split:['Secret','Carriers','Save'],text:['Message','Style','Result'],check:['Pick an image','Result']};
const MODES=[['hide','📎','Hide a file'],['two','🎭','Two passphrases'],['split','🧩','Split across images'],['text','📝','Hide in fake text'],['check','🔍','Check an image']];
const fresh=()=>({mode:'hide',step:0,payload:null,decoy:null,cover:null,quick:false,repair:true,pass:'',pass2:'',saving:0,done:null,
  secret:null,sel:[true,true,true,false,false],k:2,spass:'',msg:'meet at the usual place at 9pm',style:'syslog',order:4,textOut:false,pick:null,scanned:false});
let S=fresh();
const $=s=>document.querySelector(s),rail=$('#rail'),main=$('#main');
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1600)};
// ---------- helpers ----------
const capFor=c=>S.mode==='two'?slotCap(c.samples,.1,16):singleCap(c.samples,S.repair?16:0);
const coverBadge=(c,need)=>c.bad?['Not supported (lossy)','bad']:need>capFor(c)?['Too small','bad']:capFor(c)-need<need*.15?['Tight fit','warn']:['Fits','ok'];
function coverCards(need,key,multi){
  return `<div class="cards">${CAR.map((c,i)=>{const [b,k]=coverBadge(c,need);const on=multi?S.sel[i]&&!c.bad:S[key]===i,off=c.bad;
    return `<div class="pick ${on?'on':''} ${off?'off':''}" data-act="${multi?'toggle':'cover'}" data-v="${i}" ${off?'disabled':''}><div class="thumb ${c.th}">${c.ic}</div><b>${c.n}</b><small>${c.dim}${c.bad?'':' - holds '+fmt(capFor(c))}</small><span class="badge ${k}">${b}</span></div>`}).join('')}</div>`;
}
function fileCards(key,exclude){
  return `<div class="drop" data-act="pickfile" data-k="${key}">Drop a file here, or click to browse<br><small>(demo: picks the next sample file)</small></div><div class="cards">${PAY.map((p,i)=>`<div class="pick ${S[key]===i?'on':''} ${exclude===i?'off':''}" data-act="file" data-k="${key}" data-v="${i}" ${exclude===i?'disabled':''}><div class="thumb" style="background:#f3ecd3">${p.ic}</div><b>${p.n}</b><small>${fmt(p.size)}</small></div>`).join('')}</div>`;
}
const passField=(key,label)=>{const [w,f]=strength(S[key]);return `<label class="l">${label}</label><input type="password" data-bind="${key}" value="${S[key]}" autocomplete="off" placeholder="at least 6 characters"><div class="meter ${f<.5?'red':''}" style="margin-top:6px"><i data-live="meter-${key}" style="width:${S[key]?f*100:0}%"></i></div><div class="row"><span data-live="word-${key}">${S[key]?w:''}</span><span>use a phrase you can remember</span></div>`};
const gauge=(score)=>{const [t,k]=RISK[detect(0,0).risk&&score<5?'low':score<20?'mid':'high'];return `<div class="gauge"><i data-live="gp" style="left:${gaugePos(score)}%"></i></div><div class="row"><span>Hard to spot</span><span>Easy to spot</span></div><p style="margin:10px 0 2px"><span class="badge ${k}" data-live="gl">${t}</span> <small style="color:var(--dim)">by standard analysis tools (illustrative)</small></p>`};
const thumbCss=c=>CAR[c]?`<div class="img thumb ${CAR[c].th}" style="aspect-ratio:4/3;font-size:34px">${CAR[c].ic}</div>`:'';
// ---------- steps ----------
function stepDef(){
  const m=S.mode,i=S.step,P=PAY[S.payload],Dc=PAY[S.decoy],C=CAR[S.cover];
  if(m==='hide'){
    if(i===0)return{t:'What do you want to hide?',s:'Pick any file. It stays private: only the hidden copy leaves your computer.',h:()=>fileCards('payload'),v:()=>[S.payload!=null,'Choose a file to continue.']};
    if(i===1)return{t:'Choose a cover image',s:'The file disappears inside this image. It looks the same afterwards.',h:()=>coverCards(P.size,'cover'),v:()=>[S.cover!=null&&P.size<=capFor(C),S.cover==null?'Choose an image.':'That image is too small for '+P.n+'. Pick a bigger one.']};
    if(i===2){const dt=detect((P.size+32)*8/C.samples,S.quick);
      return{t:'How careful should we be?',s:`${P.n} (${fmt(P.size)}) is going into ${C.n}. Pick the balance that suits you.`,v:()=>[S.pass.length>=6,'Choose a passphrase of at least 6 characters.'],h:()=>`<div class="grid"><div>
        <div class="card" style="margin-bottom:16px"><h3>Hiding style</h3>
          <div class="opt ${S.quick?'on':''}" data-act="style" data-v="quick"><span class="radio"></span><div><b>Quick</b><small>Fastest, but easy for analysis tools to spot.</small></div></div>
          <div class="opt ${S.quick?'':'on'}" data-act="style" data-v="stealthy"><span class="radio"></span><div><b>Stealthy <span class="badge ok">recommended</span></b><small>Changes pixels by &plusmn;1 in a pattern only your passphrase knows.</small></div></div></div>
        <div class="card"><h3>Extras</h3><div class="toggle" data-act="repair"><div><b>Repair damage</b><br><small style="color:var(--dim)">Survives small edits and noise (adds ~7% size)</small></div><div class="sw ${S.repair?'on':''}"></div></div>
        ${passField('pass','Passphrase')}<div class="tip">Tip: do not send the result through apps that recompress images (most chat apps do).</div></div></div>
        <div><div class="card" style="margin-bottom:16px"><h3>Preview</h3><div class="preview">${thumbCss(S.cover).replace('class="img','class="img').replace('</div>','<span class="cap">Before</span></div>')}${thumbCss(S.cover).replace('</div>','<span class="cap">After</span></div>')}</div><div class="row" style="margin-top:8px"><span>Looks identical to the eye</span><span>${C.n.endsWith('.png')?'PNG, lossless':'lossless'}</span></div></div>
        <div class="card"><h3>How hidden is it?</h3><div id="gwrap">${gauge(dt.score)}</div><div class="meter ${P.size/capFor(C)>.9?'red':''}"><i style="width:${Math.min(100,100*P.size/capFor(C))}%"></i></div><div class="row"><span>Uses ${fmt(P.size)} of ${fmt(capFor(C))}</span><span>${fmt(Math.max(0,capFor(C)-P.size))} to spare</span></div></div></div></div>`};}
    if(i===3)return saveStep('hide',P,C);
  }
  if(m==='two'){
    if(i===0)return{t:'Which file should stay hidden?',s:'This is what the second passphrase reveals.',h:()=>fileCards('payload',S.decoy),v:()=>[S.payload!=null,'Choose the hidden file.']};
    if(i===1)return{t:'Pick a public file',s:'This is what the first passphrase reveals if someone makes you open the image.',h:()=>fileCards('decoy',S.payload),v:()=>[S.decoy!=null,'Choose a public file.']};
    if(i===2){const need=Math.max(P.size,Dc.size);return{t:'Choose a cover image',s:'Each secret gets its own half of the image, sized equally so neither shows up in the numbers.',h:()=>coverCards(need,'cover'),v:()=>[S.cover!=null&&need<=capFor(C),S.cover==null?'Choose an image.':'Each half of that image holds '+fmt(capFor(C))+' - pick a bigger one or smaller files.']}}
    if(i===3)return{t:'Set two passphrases',s:'They must be different. Neither one reveals that the other exists.',h:()=>`<div class="grid"><div class="card">${passField('pass','Public passphrase (shown under pressure)')}</div><div class="card">${passField('pass2','Hidden passphrase')}</div></div><div class="tip">Unused space is always filled with random data, so an image with only a public file looks identical.</div>`,v:()=>[S.pass.length>=6&&S.pass2.length>=6&&S.pass!==S.pass2,S.pass&&S.pass===S.pass2?'The two passphrases must be different.':'Both passphrases need at least 6 characters.']};
    if(i===4)return saveStep('two',P,C);
  }
  if(m==='split'){
    const sec=PAY[S.secret],n=S.sel.filter((v,j)=>v&&!CAR[j].bad).length,share=sec?sec.size+53:0;
    if(i===0)return{t:'Which secret should be split?',s:'The file is cut into shares. No single share reveals anything.',h:()=>fileCards('secret'),v:()=>[S.secret!=null,'Choose a file.']};
    if(i===1)return{t:'Choose the carrier images',s:`Each image holds one share (${fmt(share)}). Pick how many are needed to rebuild it.`,
      h:()=>`${coverCards(share,'',true)}<div class="card" style="margin-top:14px"><h3>Rebuild rule</h3><div class="row" style="font-size:15px;color:var(--ink)"><span>Any <b id="kv">${Math.min(S.k,Math.max(1,n))}</b> of <b>${n}</b> images recover the file</span></div><input type="range" min="1" max="${Math.max(1,n)}" value="${Math.min(S.k,Math.max(1,n))}" data-bind="k"><div class="row"><span>easier to rebuild</span><span>harder to steal</span></div></div>`,
      v:()=>{const bad=S.sel.map((v,j)=>v&&!CAR[j].bad&&share>capFor(CAR[j])).some(Boolean);return[n>=1&&!bad&&S.k<=n,n<1?'Select at least one image.':bad?'One selected image is too small for a share.':'Threshold cannot exceed the number of images.']}};
    if(i===2)return{...saveStep('split',sec,null),pre:()=>S.spass.length>=6,extra:()=>passField('spass','Passphrase for all shares')};
  }
  if(m==='text'){
    const key=S.style,fixed=BPW[key].length===1,bpw=BPW[key][fixed?0:S.order-1],bytes=new TextEncoder().encode(S.msg).length,words=Math.ceil((bytes+32)*8/bpw),lines=Math.max(1,Math.ceil(words/WPL[key]));
    if(i===0)return{t:'What should the text say?',s:'Your message is encrypted, then spelled out as ordinary-looking text.',h:()=>`<div class="card"><textarea data-bind="msg" placeholder="Type your message">${S.msg}</textarea><div class="row" style="margin-top:6px"><span id="mlen">${new TextEncoder().encode(S.msg).length} bytes</span><span>short messages make short logs</span></div></div>`,v:()=>[S.msg.length>0,'Type a message.']};
    if(i===1)return{t:'Pick what the text looks like',s:'Logs and config files are full of random-looking values, which makes them good cover.',
      h:()=>`<div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">${Object.keys(STY).map(k=>`<div class="pick ${S.style===k?'on':''}" data-act="style2" data-v="${k}"><b>${STY[k]}</b><div class="code" style="max-height:78px;font-size:11px;padding:8px">${(REAL[k]||[]).slice(0,2).map(l=>l.slice(0,58)).join('\n')}</div><small>${BPW[k][BPW[k].length>1?(ODEF[k]||2)-1:0]} bits/word</small></div>`).join('')}</div>
      ${BPW[key].length>1?`<div class="card" style="margin-top:14px"><h3>Realism vs length</h3><div class="row" style="font-size:15px;color:var(--ink)"><span>Context order <b id="ov">${S.order}</b> - <b id="wf">${WELL[key][S.order-1]}%</b> of lines well-formed</span></div><input type="range" min="1" max="6" value="${S.order}" data-bind="order"><div class="row"><span>shorter, more mistakes</span><span>longer, more realistic</span></div></div>`:''}`,v:()=>[true,'']};
    if(i===2)return{t:'Here is your cover text',s:`${bytes} bytes became about ${words} words (~${lines} ${key==='prose'?'lines':'log lines'}). The real tool produced these lines.`,
      h:()=>{const arr=REAL[key],n=Math.min(arr.length,lines,12);return `<div class="code" id="cover">${arr.slice(0,n).join('\n').replace(/</g,'&lt;')}${lines>n?`\n... +${lines-n} more lines`:''}</div><div class="row" style="margin-top:10px"><span>${STY[key]} - ${bpw} bits/word${WELL[key]?' - '+WELL[key][S.order-1]+'% well-formed':''}</span><span></span></div>`},v:()=>[true,''],last:true,copy:true};
  }
  if(m==='check'){
    if(i===0)return{t:'Which image should we check?',s:'We look for the statistical traces hidden data leaves behind.',h:()=>`<div class="cards">${ANA.map((a,j)=>`<div class="pick ${S.pick===j?'on':''}" data-act="pickana" data-v="${j}"><div class="thumb t1">🖼</div><b>${a.n}</b><small>${a.how}</small></div>`).join('')}</div>`,v:()=>[S.pick!=null,'Choose an image.']};
    if(i===1){const a=ANA[S.pick],sc=Math.round(100*Math.max(a.rs,a.spa)),[t,k]=RISK[sc<5?'low':sc<20?'mid':'high'];
      return{t:t==='Hard to spot'?'Nothing obvious found':sc<20?'Some traces found':'Hidden data is easy to spot',s:`${a.n} - ${a.how}`,h:()=>`<div class="grid"><div class="card"><h3>Verdict</h3>${gauge(sc)}<p style="margin:12px 0 0">Score <b>${sc} / 100</b></p></div><div class="card"><h3>Details</h3><table class="sum"><tr><td>RS estimate</td><td>${a.rs.toFixed(3)}</td></tr><tr><td>SPA estimate</td><td>${a.spa.toFixed(3)}</td></tr><tr><td>Meaning</td><td>fraction of pixels that carry a hidden message</td></tr></table><div class="tip">Classical detectors only. A low score is not proof that modern classifiers cannot find it.</div></div></div>`,v:()=>[true,''],last:true};}
  }
  return{t:'',s:'',h:()=>'',v:()=>[true,'']};
}
function saveStep(kind,P,C){
  const titles={hide:'Hide it',two:'Hide both secrets',split:'Split and hide'};
  return{t:S.done?'All done':'Ready to go',s:S.done?'Your file is saved next to the original.':'Review and press the button. Nothing is changed until you do.',save:kind,
    h:()=>{
      if(S.saving)return `<div class="card"><h3>Working</h3><div class="prog"><i style="width:${S.saving}%"></i></div><p id="prog-msg" style="margin:10px 0 0;color:var(--dim)">${S.saving<40?'Deriving your key':S.saving<75?'Hiding the data':'Writing the image'}...</p></div>`;
      if(S.done)return `<div class="card done-card"><div class="big">✅</div><b style="font-size:18px">${S.done.title}</b><table class="sum">${S.done.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>`;
      const rows=kind==='hide'?[['File',P.n+' ('+fmt(P.size)+')'],['Hidden in',C.n],['Style',S.quick?'Quick':'Stealthy'],['Repair damage',S.repair?'on':'off']]:
        kind==='two'?[['Hidden file',P.n],['Public file',PAY[S.decoy].n],['Cover',C.n],['Passphrases','two (different)']]:
        [['Secret',P.n+' ('+fmt(P.size)+')'],['Carriers',S.sel.filter((v,j)=>v&&!CAR[j].bad).length+' images'],['Rule','any '+S.k+' rebuild it']];
      return `<div class="card"><h3>Summary</h3><table class="sum">${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>${kind==='split'?`<div class="card" style="margin-top:14px">${passField('spass','Passphrase for all shares')}</div>`:''}`;},
    v:()=>kind==='split'&&!S.done&&!S.saving?[S.spass.length>=6,'Choose a passphrase of at least 6 characters.']:[true,''],btn:titles[kind]};
}
// ---------- render ----------
function render(){
  rail.innerHTML=`<div class="brand"><img src="../assets/stegosaur.png" alt=""><b>Stegosaur</b></div>${MODES.map(([k,i,l])=>`<div class="mode ${S.mode===k?'on':''}" data-act="mode" data-v="${k}"><span>${i}</span>${l}</div>`).join('')}<div class="mode" style="margin-top:auto" data-act="settings"><span>⚙</span>Settings</div>`;
  const flow=FLOWS[S.mode],d=stepDef(),[valid,hint]=d.v(),last=S.step===flow.length-1;
  const steps=flow.map((n,i)=>`<div class="st ${i<S.step?'done':i===S.step?'now':''}"><i>${i<S.step?'✓':i+1}</i>${n}</div>`).join('<div class="bar"></div>');
  let right;
  if(d.save){right=S.done?`<button class="btn alt" data-act="check">Check the result</button><button class="btn go" data-act="restart">Start over</button>`:S.saving?`<button class="btn go" disabled>Working...</button>`:`<button class="btn go" data-act="save" ${valid?'':'disabled'}>${d.btn} →</button>`}
  else if(d.last){right=(d.copy?`<button class="btn alt" data-act="copy">Copy text</button>`:'')+`<button class="btn go" data-act="restart">Start over</button>`}
  else right=`<button class="btn go" data-act="next" ${valid?'':'disabled'}>Next →</button>`;
  main.innerHTML=`<div class="steps">${steps}</div><h1>${d.t}</h1><p class="sub">${d.s}</p><div id="content">${d.h()}</div><div class="actions"><button class="btn ghost" data-act="back" ${S.step===0||S.saving||S.done?'style="visibility:hidden"':''}>← Back</button><span class="hint" id="hint">${valid?'':hint}</span><span style="display:flex;gap:10px">${right}</span></div>`;
}
function live(){ // refresh only the dynamic bits so typing keeps focus
  const d=stepDef(),[valid,hint]=d.v(),b=main.querySelector('[data-act=next],[data-act=save]');
  if(b)b.disabled=!valid;const h=$('#hint');if(h)h.textContent=valid?'':hint;
  ['pass','pass2','spass'].forEach(k=>{const m=main.querySelector(`[data-live=meter-${k}]`);if(m){const [w,f]=strength(S[k]);m.style.width=(S[k]?f*100:0)+'%';m.parentElement.classList.toggle('red',f<.5);main.querySelector(`[data-live=word-${k}]`).textContent=S[k]?w:''}});
  const ml=$('#mlen');if(ml)ml.textContent=new TextEncoder().encode(S.msg).length+' bytes';
  const ov=$('#ov');if(ov){ov.textContent=S.order;$('#wf').textContent=WELL[S.style][S.order-1]+'%'}
  const kv=$('#kv');if(kv)kv.textContent=S.k;
}
// ---------- actions ----------
function runSave(kind){
  S.saving=1;render();
  const t=setInterval(()=>{S.saving+=22;if(S.saving>=100){clearInterval(t);S.saving=0;finish(kind)}render()},330);
}
function finish(kind){
  const P=PAY[kind==='split'?S.secret:S.payload],C=CAR[S.cover];
  if(kind==='hide'){const base=C.n.replace(/\.(\w+)$/,'');S.done={title:'Hidden successfully',rows:[['Saved as',base+'.stego.png'],['Hidden',P.n+' ('+fmt(P.size)+')'],['Detectability',RISK[detect((P.size+32)*8/C.samples,S.quick).risk][0]],['Added size','about '+fmt(Math.round(C.samples*.0004))]],ana:S.quick?2:1}}
  if(kind==='two')S.done={title:'Both secrets hidden',rows:[['Saved as',C.n.replace(/\.(\w+)$/,'')+'.stego.png'],['Public file',PAY[S.decoy].n],['Hidden file',P.n],['Look-alike','identical with or without the hidden file']],ana:1};
  if(kind==='split'){const ids=S.sel.map((v,j)=>v&&!CAR[j].bad?j:-1).filter(j=>j>=0);S.done={title:'Split into '+ids.length+' images',rows:[['Rule','any '+S.k+' of '+ids.length+' rebuild it'],...ids.map((j,x)=>['Share '+(x+1),CAR[j].n.replace(/\.(\w+)$/,'')+'.share'+(x+1)+'.png'])],ana:1}}
}
function act(a,d){
  const next=()=>{S.step++;render()};
  if(a==='mode'){S=Object.assign(fresh(),{mode:d.v,payload:S.payload,secret:S.secret});return render()}
  if(a==='next')return next();
  if(a==='back'){S.step=Math.max(0,S.step-1);return render()}
  if(a==='file'){if(PAY[+d.v]&&!(d.k==='payload'&&S.decoy===+d.v)&&!(d.k==='decoy'&&S.payload===+d.v)){S[d.k]=+d.v}return render()}
  if(a==='pickfile'){let i=(S[d.k]==null?0:S[d.k]+1)%PAY.length;const other=d.k==='payload'?S.decoy:d.k==='decoy'?S.payload:null;if(i===other)i=(i+1)%PAY.length;S[d.k]=i;return render()}
  if(a==='cover'){S.cover=+d.v;return render()}
  if(a==='toggle'){const i=+d.v;if(!CAR[i].bad)S.sel[i]=!S.sel[i];const n=S.sel.filter((v,j)=>v&&!CAR[j].bad).length;S.k=Math.min(S.k,Math.max(1,n));return render()}
  if(a==='style'){S.quick=d.v==='quick';return render()}
  if(a==='repair'){S.repair=!S.repair;return render()}
  if(a==='style2'){S.style=d.v;S.order=ODEF[d.v]||2;return render()}
  if(a==='save')return runSave(stepDef().save);
  if(a==='restart'){const m=S.mode;S=Object.assign(fresh(),{mode:m});return render()}
  if(a==='check'){const ana=S.done&&S.done.ana;S=Object.assign(fresh(),{mode:'check',step:1,pick:ana==null?1:ana});return render()}
  if(a==='pickana'){S.pick=+d.v;return render()}
  if(a==='copy'){const t=($('#cover')||{}).textContent||'';try{navigator.clipboard.writeText(t).then(()=>toast('Copied to clipboard'),()=>toast('Select the text and copy it'))}catch(e){toast('Select the text and copy it')}return}
  if(a==='settings')return toast('Settings: scrypt cost, default parity, output folder (not in this mockup)');
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.hasAttribute('disabled'))return;act(t.dataset.act,t.dataset)});
document.addEventListener('input',e=>{const k=e.target.dataset.bind;if(!k)return;S[k]=e.target.type==='range'?+e.target.value:e.target.value;
  if(S.mode==='hide'&&S.step===2)return live();live()});
render();
// ---------- self-test hook (used by the automated check; harmless in normal use) ----------
window.__selftest=async()=>{
  const R=[],ok=(c,m)=>R.push([!!c,m]),sleep=ms=>new Promise(r=>setTimeout(r,ms)),click=sel=>{const el=document.querySelector(sel);if(el)el.click();return !!el};
  const type=(sel,v)=>{const el=document.querySelector(sel);el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}))};
  const nextOn=()=>{const b=document.querySelector('[data-act=next],[data-act=save]');return b&&!b.disabled};
  ok(main.textContent.includes('What do you want to hide'),'hide flow starts on step 1');
  ok(!nextOn(),'Next is disabled until a file is chosen');
  click('[data-act=file][data-v="3"]');click('[data-act=next]');
  ok(main.textContent.includes('Choose a cover image'),'advances to cover step');
  click('[data-act=cover][data-v="3"]');ok(!nextOn()&&main.textContent.includes('too small'),'oversize file blocks Next with a clear message');
  click('[data-act=back]');click('[data-act=file][data-v="1"]');click('[data-act=next]');click('[data-act=cover][data-v="0"]');ok(nextOn(),'fitting image enables Next');
  ok(!document.querySelector('[data-act=cover][data-v="4"]:not([disabled])'),'lossy JPEG card is disabled');
  click('[data-act=next]');ok(main.textContent.includes('How careful'),'protect step shown');
  ok(!nextOn(),'Next disabled without passphrase');type('[data-bind=pass]','abc');ok(!nextOn(),'short passphrase rejected');type('[data-bind=pass]','correct horse');ok(nextOn(),'good passphrase accepted');
  const g1=document.querySelector('[data-live=gl]').textContent;click('[data-act=style][data-v=quick]');const g2=document.querySelector('[data-live=gl]').textContent;
  ok(g1==='Hard to spot'&&g2!==g1,'switching to Quick makes the gauge worse ('+g1+' -> '+g2+')');click('[data-act=style][data-v=stealthy]');
  click('[data-act=next]');click('[data-act=save]');await sleep(300);ok(main.textContent.includes('Working')||document.querySelector('.prog'),'progress shown while saving');
  await sleep(1800);ok(main.textContent.includes('Hidden successfully'),'save finishes with a success card');
  click('[data-act=check]');ok(main.textContent.includes('Hard to spot')||main.textContent.includes('Nothing obvious'),'Check the result opens the verdict for the new file');
  click('[data-act=mode][data-v=two]');click('[data-act=file][data-v="2"]');click('[data-act=next]');
  ok(document.querySelector('[data-act=file][data-v="2"][disabled]'),'public-file step blocks reusing the hidden file');
  click('[data-act=file][data-v="0"]');click('[data-act=next]');
  click('[data-act=cover][data-v="0"]');ok(!nextOn()&&main.textContent.includes('Each half of that image holds'),'a half-image slot too small for the file is blocked with an explanation');
  click('[data-act=cover][data-v="1"]');ok(nextOn(),'two-passphrase cover step accepts an image whose slots fit');click('[data-act=next]');
  type('[data-bind=pass]','same phrase here');type('[data-bind=pass2]','same phrase here');ok(!nextOn()&&main.textContent.includes('must be different'),'identical passphrases are rejected');
  type('[data-bind=pass2]','a different one');ok(nextOn(),'different passphrases accepted');
  click('[data-act=mode][data-v=split]');click('[data-act=file][data-v="2"]');click('[data-act=next]');
  click('[data-act=toggle][data-v="0"]');click('[data-act=toggle][data-v="1"]');click('[data-act=toggle][data-v="2"]');
  const rng=document.querySelector('[data-bind=k]');ok(rng&&+rng.max===Math.max(1,document.querySelectorAll('.pick.on').length),'threshold slider max follows selected carriers');
  click('[data-act=mode][data-v=text]');type('[data-bind=msg]','');ok(!nextOn(),'empty message blocks Next');type('[data-bind=msg]','hello there');click('[data-act=next]');
  click('[data-act=style2][data-v=postgres]');click('[data-act=next]');ok(/UTC \[/.test(document.querySelector('#cover').textContent),'cover text shows real Postgres lines');
  click('[data-act=mode][data-v=check]');click('[data-act=pickana][data-v="2"]');click('[data-act=next]');ok(main.textContent.includes('easy to spot')||main.textContent.includes('Easy to spot'),'checking the Quick image reports it as easy to spot');
  return R;
};
</script>
