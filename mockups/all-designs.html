<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stegosaur design options</title>
<style>
  :root{--bar:#16201a;--ink:#e8efd9;--dim:#8aa090;--green:#a9cf7a;--line:#33463a}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#0c130f;font:14px/1.3 system-ui,"Segoe UI",sans-serif}
  .bar{height:52px;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--bar);border-bottom:1px solid var(--line);color:var(--ink)}
  .bar img{width:30px;height:30px;border-radius:50%}
  .bar b{font-size:15px;white-space:nowrap}
  .tabs{display:flex;gap:6px;margin-left:8px}
  .tabs button{display:flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--dim);font:inherit;cursor:pointer}
  .tabs button kbd{background:#26382c;color:var(--ink);border-radius:4px;padding:0 6px;font:600 12px ui-monospace,Consolas,monospace}
  .tabs button:hover{color:var(--ink)}
  .tabs button.on{background:var(--green);border-color:var(--green);color:#16240f;font-weight:600}
  .tabs button.on kbd{background:#16240f;color:var(--green)}
  .desc{margin-left:auto;color:var(--dim);font-size:12.5px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #stage{height:calc(100% - 52px)}
  iframe{display:block;width:100%;height:100%;border:0;background:#fff}
  [hidden]{display:none!important}
  @media(max-width:760px){.desc{display:none}.bar b{display:none}}
</style>
</head>
<body>
<div class="bar">
  <img src="../assets/stegosaur.png" alt=""><b>Stegosaur - design options</b>
  <div class="tabs" id="tabs">
    <button data-id="a"><kbd>A</kbd>Terminal</button>
    <button data-id="b"><kbd>B</kbd>Guided</button>
    <button data-id="c"><kbd>C</kbd>Workbench</button>
    <button data-id="d"><kbd>D</kbd>Friendly Workbench</button>
  </div>
  <div class="desc" id="desc"></div>
</div>
<div id="stage"></div>
<script type="text/template" id="tpl-a">
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stegosaur TUI mockup</title>
<style>
  :root{--bg:#14211a;--panel:#1b2c22;--ink:#e8efd9;--dim:#7f9a86;--green:#a9cf7a;--orange:#f0883e;--sky:#8fcbe9;--red:#e5684f;--line:#3d5a45}
  *{box-sizing:border-box}
  body{margin:0;background:#0c130f;color:var(--ink);font:14px/20px ui-monospace,"Cascadia Mono",Consolas,monospace;padding:20px 12px;overflow-x:auto}
  .note{width:calc(98ch + 40px);max-width:100%;margin:0 auto 12px;color:var(--dim);font:12px/1.4 system-ui,sans-serif}
  .term{width:calc(98ch + 40px);margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 12px 40px #0008}
  .titlebar{display:flex;gap:8px;align-items:center;padding:6px 12px;background:#0f1913;border-bottom:1px solid var(--line);color:var(--dim);font-size:12px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
  .tabs{display:flex;gap:2px;padding:8px 10px 0;background:var(--panel);border-bottom:1px solid var(--line)}
  .tab{padding:2px 12px;color:var(--dim);cursor:pointer;border:1px solid transparent;border-bottom:none;border-radius:4px 4px 0 0;user-select:none}
  .tab b{color:var(--orange)}
  .tab.on{color:var(--ink);background:var(--bg);border-color:var(--line)}
  #scr{margin:0;padding:12px 20px;font:inherit;line-height:20px;white-space:pre;outline:none;cursor:default;user-select:none;height:calc(20px * 32 + 24px)}
  #scr .g{color:var(--green)} #scr .o{color:var(--orange)} #scr .s{color:var(--sky)} #scr .d{color:var(--dim)} #scr .r{color:var(--red)}
  #scr .w{color:var(--ink);font-weight:700}
  #scr .hl{background:var(--green);color:#10200f} #scr .hs{background:#2b4231}
  #scr .ho{background:var(--orange);color:#1a1008}
  .foot{display:flex;flex-wrap:wrap;gap:2px 16px;padding:6px 14px;background:#0f1913;border-top:1px solid var(--line);color:var(--dim);font-size:12px;line-height:18px}
  .foot b{color:var(--ink);background:var(--line);padding:0 5px;border-radius:3px;font-weight:500}
  #m{position:absolute;visibility:hidden;font:inherit}
</style>
</head>
<body>
<p class="note">Option A - Terminal UI (ratatui). Fully clickable and keyboard-driven: Tab / Shift+Tab move between fields, arrows change values, Space toggles, Enter runs, 1-5 switch screens. Capacity and counts use the real formulas; detectability is an illustrative model; cover-text lines are real tool output.</p>
<div class="term">
  <div class="titlebar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>&nbsp; stegosaur - C:\Users\Tung\Pictures</div>
  <div class="tabs" id="tabs"></div>
  <pre id="scr" tabindex="0"></pre>
  <div class="foot" id="foot"></div>
</div>
<span id="m">0</span>
<script src="samples.js">@@SCRIPT_END@@
<script>
const W=98,H=32;
// ---------- sample data ----------
const CAR=[
  {n:'beach.png',dim:'1024x768',samples:1024*768*3,size:1.9e6},
  {n:'city.png',dim:'2048x1365',samples:2048*1365*3,size:5.2e6},
  {n:'forest.bmp',dim:'800x600',samples:800*600*3,size:1.4e6},
  {n:'voice.wav',dim:'44.1kHz',samples:1500000,size:3.0e6},
  {n:'photo.jpg',dim:'lossy',samples:0,size:0,bad:true}
];
const PAY=[{n:'notes.txt',size:4096},{n:'report.pdf',size:225280},{n:'keys.zip',size:18432},{n:'archive.tar',size:1288490}];
const STYLES=['prose','syslog','postgres','nginx','env'];
const BPW={prose:[2.59],syslog:[1.83,1.35,1.09,.85,.60,.42],postgres:[1.78,1.48,1.06,.84,.58,.47],nginx:[1.62,1.30,1.24,1.14,.87,.49],env:[.57]};
const WELL={syslog:[31,75,87,95,100,100],postgres:[80,100,100,100,100,100],nginx:[11,100,100,100,100,100]};
const WPL={prose:14,syslog:14,postgres:15,nginx:20,env:1.2};
const ORDER_DEFAULT={syslog:4,postgres:2,nginx:2};
const ANA=[
  {n:'beach.png',how:'original',rs:.003,spa:.001,chi:.31},
  {n:'beach.stego.png',how:'match, 76% full',rs:.012,spa:.004,chi:.28},
  {n:'beach.replace.png',how:'replace, 76% full',rs:.762,spa:.744,chi:.99},
  {n:'city.stego.png',how:'match, 5% full',rs:.004,spa:.002,chi:.30}
];
// ---------- real formulas ----------
const wireAvail=(a,p)=>{if(!p)return a;const f=Math.floor(a/255),r=a%255;return f*(255-p)+Math.max(0,r-p)};
const singleCap=(s,p)=>Math.max(0,wireAvail(Math.max(0,Math.floor(s/8)-4-(p||0)),p)-28);
const slotCap=(s,rate,p)=>{const reg=Math.floor(s/2),slot=Math.min(Math.floor(reg*rate/8),Math.floor(reg/8));return Math.max(0,wireAvail(slot,p)-32)};
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+' MB':n>=1024?((n/1024)>=100?Math.round(n/1024):(n/1024).toFixed(1))+' KB':n+' B';
const detect=(fill,mode)=>{const rs=mode==='replace'?Math.min(1,fill):.004+.02*fill,spa=mode==='replace'?Math.min(1,fill*.98):.002+.01*fill;const score=Math.round(100*Math.max(rs,spa));return{rs,spa,score,risk:score<5?'LOW':score<20?'MEDIUM':'HIGH',k:score<5?'g':score<20?'o':'r'}};
// ---------- state ----------
const st={tab:0,
  emb:{car:0,pay:1,pass:'correct horse battery',mode:'match',par:16,log:[],busy:false,focus:0},
  den:{car:0,rate:10,a:0,aPass:'innocent',b:1,bPass:'the real one',log:[],busy:false,focus:0},
  ana:{sel:1,res:{},busy:false,focus:0},
  spl:{sec:2,k:3,pass:'shared secret',sel:[true,true,true,true],cur:0,log:[],busy:false,focus:0},
  txt:{style:1,order:4,msg:'meet at the usual place at 9pm',out:null,busy:false,focus:0}};
// ---------- char-grid renderer ----------
let buf,hits;
const mk=()=>Array.from({length:H},()=>Array.from({length:W},()=>[' ','']));
function put(x,y,s,k){s=String(s);for(let i=0;i<s.length;i++){const cx=x+i;if(cx>=0&&cx<W&&y>=0&&y<H)buf[y][cx]=[s[i],k||'']}}
function paint(x,y,w,k){for(let i=0;i<w;i++)if(x+i<W&&y<H)buf[y][x+i][1]=k}
function box(x,y,w,h,title,k){
  put(x,y,'┌'+'─'.repeat(w-2)+'┐',k);put(x,y+h-1,'└'+'─'.repeat(w-2)+'┘',k);
  for(let i=1;i<h-1;i++){put(x,y+i,'│',k);put(x+w-1,y+i,'│',k)}
  if(title)put(x+2,y,' '+title+' ',k);
}
function bar(x,y,w,f,k,mark){const n=Math.round(w*Math.max(0,Math.min(1,f)));put(x,y,'█'.repeat(n),k);put(x+n,y,'░'.repeat(w-n),'d');if(mark!=null){const m=Math.min(w-1,Math.round(w*mark));buf[y][x+m]=['┃','o']}}
const fit=(s,n)=>{s=String(s);return s.length>n?s.slice(0,n-1)+'…':s.padEnd(n)};
function hit(x,y,w,h,f,fn){hits.push({x,y,w,h,f,fn})}
function render(){
  const out=buf.map(row=>{let html='',cur=null,run='';
    for(const [c,k] of row){if(k!==cur){if(run)html+=cur?`<span class="${cur}">${run}</span>`:run;run='';cur=k}run+=c==='<'?'&lt;':c==='>'?'&gt;':c==='&'?'&amp;':c}
    if(run)html+=cur?`<span class="${cur}">${run}</span>`:run;return html});
  scr.innerHTML=out.join('\n');
}
const scr=document.getElementById('scr'),foot=document.getElementById('foot'),tabsEl=document.getElementById('tabs');
// ---------- widgets ----------
function stepper(x,y,label,value,focused,dec,inc,lw){
  put(x,y,label,focused?'o':'d');const vx=x+(lw||label.length)+1;
  put(vx,y,'◀','s');hit(vx,y,1,1,null,dec);
  const v=' '+value+' ';put(vx+1,y,v,focused?'hl':'w');
  put(vx+1+v.length,y,'▶','s');hit(vx+1+v.length,y,1,1,null,inc);
  return vx+3+v.length;
}
function textField(x,y,w,label,value,focused,mask){
  put(x,y,label,focused?'o':'d');const vx=x+label.length+1;
  const shown=mask?'•'.repeat(value.length):value;const s=shown.slice(-(w-1))+(focused?'▌':'');
  put(vx,y,s.padEnd(w),focused?'hs':'');if(mask)paint(vx,y,shown.length?Math.min(shown.length,w):0,focused?'hs o':'o');
  return vx+w;
}
function button(x,y,label,focused,fn){put(x,y,'[ '+label+' ]',focused?'ho':'g');hit(x,y,label.length+4,1,null,fn)}
function logBox(x,y,w,h,L,focusColor){
  box(x,y,w,h,'Log','g');
  if(!L.length)put(x+2,y+1,'(nothing yet - press Enter on the run button)','d');
  L.slice(-(h-2)).forEach((l,i)=>put(x+2,y+1+i,fit(l.t+'  '+l.text,w-4),l.k||'d'));
}
const stamp=()=>{const d=new Date();return[d.getHours(),d.getMinutes(),d.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':')};
function logTo(s,text,k){s.log.push({t:stamp(),text,k});if(s.log.length>40)s.log.shift()}
function sequence(s,steps,done){s.busy=true;let t=0;steps.forEach(([dt,fn])=>{t+=dt;setTimeout(()=>{fn();draw()},t)});setTimeout(()=>{s.busy=false;if(done)done();draw()},t+30)}
const strength=p=>Math.min(1,p.length/16);
// ---------- screens ----------
const TABS=['Embed','Hidden','Analyze','Split','Cover text'];
const F=[]; // per tab: field descriptors, rebuilt every draw
function fieldFocus(i){return st[['emb','den','ana','spl','txt'][st.tab]].focus===i}
function drawEmbed(){
  const s=st.emb,f=s.focus,c=CAR[s.car],p=PAY[s.pay],cap=singleCap(c.samples,s.par);
  F[0]=[{t:'list',len:CAR.length,get:()=>s.car,set:i=>{if(!CAR[i].bad)s.car=i},skip:i=>CAR[i].bad},
        {t:'list',len:PAY.length,get:()=>s.pay,set:i=>s.pay=i},
        {t:'text',get:()=>s.pass,set:v=>s.pass=v,max:40},
        {t:'step',dec:()=>s.mode='replace',inc:()=>s.mode='match'},
        {t:'step',dec:()=>s.par=Math.max(0,s.par-2),inc:()=>s.par=Math.min(64,s.par+2)},
        {t:'btn',run:runEmbed}];
  box(0,0,48,10,'Carrier',f==0?'o':'g');put(2,1,'C:\\Users\\Tung\\Pictures\\','d');
  CAR.forEach((r,i)=>{const y=2+i,sel=i==s.car;put(2,y,fit((sel?'▸ ':'  ')+r.n.padEnd(16)+r.dim.padEnd(12)+(r.bad?'':fmt(r.size)).padStart(8),44),r.bad?'d':'');if(sel)paint(2,y,44,f==0?'hl':'hs');if(!r.bad)hit(2,y,44,1,0,()=>{s.car=i});});
  put(2,7,'photo.jpg is lossy: LSB data would not survive','d');
  box(50,0,48,10,'Payload',f==1?'o':'g');put(52,1,'C:\\Users\\Tung\\Documents\\','d');
  PAY.forEach((r,i)=>{const y=2+i,sel=i==s.pay;put(52,y,fit((sel?'▸ ':'  ')+r.n.padEnd(20)+fmt(r.size).padStart(14),44));if(sel)paint(52,y,44,f==1?'hl':'hs');hit(52,y,44,1,1,()=>{s.pay=i});});
  put(52,7,'(any file)','d');
  box(0,10,98,4,'Settings',f>=2&&f<=4?'o':'g');
  const px=textField(2,11,26,'Passphrase',s.pass,f==2,true);hit(2,11,40,1,2);
  put(px+2,11,'strength','d');bar(px+11,11,12,strength(s.pass),strength(s.pass)>.7?'g':strength(s.pass)>.4?'o':'r');put(px+24,11,strength(s.pass)>.7?'strong':strength(s.pass)>.4?'ok':'weak',strength(s.pass)>.7?'g':strength(s.pass)>.4?'o':'r');
  put(2,12,'Mode',f==3?'o':'d');put(15,12,s.mode==='replace'?'(●) replace':'( ) replace',s.mode==='replace'?'g':'');hit(15,12,13,1,3,()=>s.mode='replace');
  put(30,12,s.mode==='match'?'(●) match (recommended)':'( ) match (recommended)',s.mode==='match'?'g':'');hit(30,12,24,1,3,()=>s.mode='match');
  stepper(57,12,'Error correction',s.par?s.par+' bytes':'off',f==4,()=>{s.par=Math.max(0,s.par-2)},()=>{s.par=Math.min(64,s.par+2)});
  if(s.par)put(72,11,`repairs ~${(s.par/2/255/8*100).toFixed(1)}% noise`,'d');
  box(0,14,48,5,'Capacity','g');
  const fits=p.size<=cap,fill=cap?p.size/cap:1,fillS=(p.size+32)*8/c.samples,dt=detect(fillS,s.mode);
  bar(2,15,44,fill,fits?'g':'r');
  put(2,16,`${fmt(p.size)} of ${fmt(cap)} capacity  `,'');put(2+`${fmt(p.size)} of ${fmt(cap)} capacity  `.length,16,Math.round(fill*100)+'%',fits?'g':'r');
  put(2,17,fits?`fits - ${fmt(cap-p.size)} to spare`:`too large by ${fmt(p.size-cap)} - pick a bigger image`,fits?'d':'r');
  box(50,14,48,5,'Detectability (classical, illustrative)','g');
  put(52,15,'RS ','d');bar(56,15,24,dt.rs,dt.k,.05);put(82,15,dt.rs.toFixed(3),'w');
  put(52,16,'SPA','d');bar(56,16,24,dt.spa,dt.k,.05);put(82,16,dt.spa.toFixed(3),'w');
  put(52,17,'score ','d');put(58,17,`${dt.score} / 100  ${dt.risk}`,dt.k);put(58+`${dt.score} / 100  ${dt.risk}`.length+1,17,'(not proof of safety)','d');
  const outName=c.n.replace(/\.(\w+)$/,'.stego.$1');
  put(1,19,'equivalent command:','d');put(21,19,fit(`stegosaur embed ${c.n} ${outName} --data ${p.n} --parity ${s.par}${s.mode==='replace'?' --mode replace':''}`,76),'s');
  button(2,20,'Enter  Embed',f==5,runEmbed);put(20,20,s.busy?'working...':'output: '+outName,s.busy?'o':'d');
  logBox(0,22,98,10,s.log);
}
function runEmbed(){
  const s=st.emb;if(s.busy)return;const c=CAR[s.car],p=PAY[s.pay],cap=singleCap(c.samples,s.par);
  if(!s.pass){logTo(s,'error: passphrase must not be empty','r');return}
  if(p.size>cap){logTo(s,`error: payload needs ${p.size} bytes but carrier holds ${cap}`,'r');return}
  const out=c.n.replace(/\.(\w+)$/,'.stego.$1'),ms=Math.max(2,Math.round(c.samples/2.4e5));
  sequence(s,[[10,()=>logTo(s,`reading ${c.n} (${c.dim})`,'d')],[350,()=>logTo(s,'scrypt N=2^15 ........ 54 ms','d')],[300,()=>logTo(s,`placed ${(p.size*8/1000).toFixed(0)}k bits (+-1 matching) ........ ${Math.max(1,Math.round(p.size/9000))} ms`,'d')],
    [250,()=>logTo(s,`wrote ${out} - PNG written in ${ms} ms`,'g')]]);
}
function drawDeniable(){
  const s=st.den,f=s.focus,c=CAR[s.car],cap=slotCap(c.samples,s.rate/100,16);
  const pays=[...PAY,{n:'(none - public file only)',size:0,none:true}];
  F[1]=[{t:'step',dec:()=>{do{s.car=(s.car+CAR.length-1)%CAR.length}while(CAR[s.car].bad)},inc:()=>{do{s.car=(s.car+1)%CAR.length}while(CAR[s.car].bad)}},
        {t:'step',dec:()=>s.rate=Math.max(2,s.rate-2),inc:()=>s.rate=Math.min(30,s.rate+2)},
        {t:'step',dec:()=>s.a=(s.a+PAY.length-1)%PAY.length,inc:()=>s.a=(s.a+1)%PAY.length},
        {t:'text',get:()=>s.aPass,set:v=>s.aPass=v,max:30},
        {t:'step',dec:()=>s.b=(s.b+pays.length-1)%pays.length,inc:()=>s.b=(s.b+1)%pays.length},
        {t:'text',get:()=>s.bPass,set:v=>s.bPass=v,max:30},
        {t:'btn',run:runDen}];
  box(0,0,98,4,'Two passphrases, one image',f<2?'o':'g');
  let x=stepper(2,1,'Carrier',c.n,f==0,()=>F[1][0].dec(),()=>F[1][0].inc());
  x=stepper(x+3,1,'slot size',s.rate+'%',f==1,()=>F[1][1].dec(),()=>F[1][1].inc());
  put(x+3,1,'each slot holds up to ','d');put(x+25,1,fmt(cap),'g');
  put(2,2,'Two slots in disjoint halves of the image; neither slot reveals the other exists.','d');
  const slot=(x0,title,fi,fileIdx,list,pass,passVal,note,optional)=>{
    const foc=f==fi||f==fi+1,item=list[fileIdx],big=item.size>cap;
    box(x0,4,48,8,title,foc?'o':'g');
    stepper(x0+2,5,'file      ',item.n,f==fi,()=>F[1][fi].dec(),()=>F[1][fi].inc(),9);
    put(x0+2,6,'size      ','d');put(x0+12,6,item.none?'-':fmt(item.size),'');
    textField(x0+2,7,24,'passphrase',passVal,f==fi+1,true);hit(x0+2,7,40,1,fi+1);
    put(x0+2,9,item.none?'slot filled with random bytes':big?`too large: slot holds ${fmt(cap)}`:`fits (slot holds ${fmt(cap)})`,item.none?'d':big?'r':'g');
    put(x0+2,10,note,'d');
  };
  slot(0,'Slot A - public',2,s.a,PAY,'',s.aPass,'revealed if you are forced to talk');
  slot(50,'Slot B - real (optional)',4,s.b,pays,'',s.bPass,'never reveals slot A exists');
  put(1,12,'An unused slot is always filled with random bytes, so images with only a public file look identical.','d');
  put(1,13,'Slot sizes are fixed, so payload length is not visible either.','d');
  button(2,15,'Enter  Embed',f==6,runDen);put(20,15,s.busy?'working...':'output: '+c.n.replace(/\.(\w+)$/,'.stego.$1'),s.busy?'o':'d');
  logBox(0,17,98,10,s.log);
}
function runDen(){
  const s=st.den;if(s.busy)return;const c=CAR[s.car],cap=slotCap(c.samples,s.rate/100,16),A=PAY[s.a],hasB=s.b<PAY.length,B=PAY[s.b];
  if(!s.aPass){logTo(s,'error: public passphrase must not be empty','r');return}
  if(hasB&&!s.bPass){logTo(s,'error: hidden passphrase must not be empty','r');return}
  if(hasB&&s.aPass===s.bPass){logTo(s,'error: public and hidden passphrases must differ','r');return}
  if(A.size>cap){logTo(s,`error: public file needs ${A.size} bytes but a slot holds ${cap}`,'r');return}
  if(hasB&&B.size>cap){logTo(s,`error: hidden payload needs ${B.size} bytes but a slot holds ${cap}`,'r');return}
  sequence(s,[[10,()=>logTo(s,`reading ${c.n}`,'d')],[350,()=>logTo(s,hasB?'scrypt x2 (two passphrases) ........ 108 ms':'scrypt ........ 54 ms','d')],
    [300,()=>logTo(s,`slot A: ${A.n}  slot B: ${hasB?B.n:'random filler'}`,'d')],[250,()=>logTo(s,`wrote ${c.n.replace(/\.(\w+)$/,'.stego.$1')} - both slots written at identical size`,'g')]]);
}
function drawAnalyze(){
  const s=st.ana,f=s.focus,e=ANA[s.sel],r=s.res[s.sel];
  F[2]=[{t:'list',len:ANA.length,get:()=>s.sel,set:i=>s.sel=i},{t:'btn',run:runAna}];
  box(0,0,98,26,'Analyze',f==0?'o':'g');

    if(k==='Enter'||k==='ArrowDown'){move(s,1);e.preventDefault();return draw()}

});

function saveStep(kind,P,C){

      if(S.done)return `<div class="card done-card"><div class="big">✅</div><b style="font-size:18px">${S.done.title}</b><table class="sum">${S.done.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>`;

      return `<div class="card"><h3>Summary</h3><table class="sum">${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>${kind==='split'?`<div class="card" style="margin-top:14px">${passField('spass','Passphrase for all shares')}</div>`:''}`;},
    v:()=>kind==='split'&&!S.done&&!S.saving?[S.spass.length>=6,'Choose a passphrase of at least 6 characters.']:[true,''],btn:titles[kind]};

// ---------- render ----------
function render(){
  rail.innerHTML=`<div class="brand"><img src="../assets/stegosaur.png" alt=""><b>Stegosaur</b></div>${MODES.map(([k,i,l])=>`<div class="mode ${S.mode===k?'on':''}" data-act="mode" data-v="${k}"><span>${i}</span>${l}</div>`).join('')}<div class="mode" style="margin-top:auto" data-act="settings"><span>⚙</span>Settings</div>`;
  const flow=FLOWS[S.mode],d=stepDef(),[valid,hint]=d.v(),last=S.step===flow.length-1;
  const steps=flow.map((n,i)=>`<div class="st ${i<S.step?'done':i===S.step?'now':''}"><i>${i<S.step?'✓':i+1}</i>${n}</div>`).join('<div class="bar"></div>');
  let right;
  if(d.save){right=S.done?`<button class="btn alt" data-act="check">Check the result</button><button class="btn go" data-act="restart">Start over</button>`:S.saving?`<button class="btn go" disabled>Working...</button>`:`<button class="btn go" data-act="save" ${valid?'':'disabled'}>${d.btn} →</button>`}
  else if(d.last){right=(d.copy?`<button class="btn alt" data-act="copy">Copy text</button>`:'')+`<button class="btn go" data-act="restart">Start over</button>`}
  else right=`<button class="btn go" data-act="next" ${valid?'':'disabled'}>Next →</button>`;
  main.innerHTML=`<div class="steps">${steps}</div><h1>${d.t}</h1><p class="sub">${d.s}</p><div id="content">${d.h()}</div><div class="actions"><button class="btn ghost" data-act="back" ${S.step===0||S.saving||S.done?'style="visibility:hidden"':''}>← Back</button><span class="hint" id="hint">${valid?'':hint}</span><span style="display:flex;gap:10px">${right}</span></div>`;
}
function live(){ // refresh only the dynamic bits so typing keeps focus
  const d=stepDef(),[valid,hint]=d.v(),b=main.querySelector('[data-act=next],[data-act=save]');
  if(b)b.disabled=!valid;const h=$('#hint');if(h)h.textContent=valid?'':hint;
  ['pass','pass2','spass'].forEach(k=>{const m=main.querySelector(`[data-live=meter-${k}]`);if(m){const [w,f]=strength(S[k]);m.style.width=(S[k]?f*100:0)+'%';m.parentElement.classList.toggle('red',f<.5);main.querySelector(`[data-live=word-${k}]`).textContent=S[k]?w:''}});
  const ml=$('#mlen');if(ml)ml.textContent=new TextEncoder().encode(S.msg).length+' bytes';
  const ov=$('#ov');if(ov){ov.textContent=S.order;$('#wf').textContent=WELL[S.style][S.order-1]+'%'}

// ---------- actions ----------
function runSave(kind){
  S.saving=1;render();
  const t=setInterval(()=>{S.saving+=22;if(S.saving>=100){clearInterval(t);S.saving=0;finish(kind)}render()},330);
}
function finish(kind){
  const P=PAY[kind==='split'?S.secret:S.payload],C=CAR[S.cover];
  if(kind==='hide'){const base=C.n.replace(/\.(\w+)$/,'');S.done={title:'Hidden successfully',rows:[['Saved as',base+'.stego.png'],['Hidden',P.n+' ('+fmt(P.size)+')'],['Detectability',RISK[detect((P.size+32)*8/C.samples,S.quick).risk][0]],['Added size','about '+fmt(Math.round(C.samples*.0004))]],ana:S.quick?2:1}}
  if(kind==='two')S.done={title:'Both secrets hidden',rows:[['Saved as',C.n.replace(/\.(\w+)$/,'')+'.stego.png'],['Public file',PAY[S.decoy].n],['Hidden file',P.n],['Look-alike','identical with or without the hidden file']],ana:1};
  if(kind==='split'){const ids=S.sel.map((v,j)=>v&&!CAR[j].bad?j:-1).filter(j=>j>=0);S.done={title:'Split into '+ids.length+' images',rows:[['Rule','any '+S.k+' of '+ids.length+' rebuild it'],...ids.map((j,x)=>['Share '+(x+1),CAR[j].n.replace(/\.(\w+)$/,'')+'.share'+(x+1)+'.png'])],ana:1}}
}
function act(a,d){
  const next=()=>{S.step++;render()};
  if(a==='mode'){S=Object.assign(fresh(),{mode:d.v,payload:S.payload,secret:S.secret});return render()}
  if(a==='next')return next();
  if(a==='back'){S.step=Math.max(0,S.step-1);return render()}
  if(a==='file'){if(PAY[+d.v]&&!(d.k==='payload'&&S.decoy===+d.v)&&!(d.k==='decoy'&&S.payload===+d.v)){S[d.k]=+d.v}return render()}
  if(a==='pickfile'){let i=(S[d.k]==null?0:S[d.k]+1)%PAY.length;const other=d.k==='payload'?S.decoy:d.k==='decoy'?S.payload:null;if(i===other)i=(i+1)%PAY.length;S[d.k]=i;return render()}
  if(a==='cover'){S.cover=+d.v;return render()}
  if(a==='toggle'){const i=+d.v;if(!CAR[i].bad)S.sel[i]=!S.sel[i];const n=S.sel.filter((v,j)=>v&&!CAR[j].bad).length;S.k=Math.min(S.k,Math.max(1,n));return render()}

  if(a==='repair'){S.repair=!S.repair;return render()}
  if(a==='style2'){S.style=d.v;S.order=ODEF[d.v]||2;return render()}
  if(a==='save')return runSave(stepDef().save);
  if(a==='restart'){const m=S.mode;S=Object.assign(fresh(),{mode:m});return render()}
  if(a==='check'){const ana=S.done&&S.done.ana;S=Object.assign(fresh(),{mode:'check',step:1,pick:ana==null?1:ana});return render()}

<script>
// ---------- data and real formulas ----------
const CAR=[{n:'beach.png',d:'1024x768',samples:1024*768*3,c:'linear-gradient(135deg,#9bd0ea,#a9cf7a)',ic:''},
  {n:'city.png',d:'2048x1365',samples:2048*1365*3,c:'linear-gradient(135deg,#d99a6c,#7a6a4a)',ic:''},
  {n:'forest.bmp',d:'800x600',samples:800*600*3,c:'linear-gradient(135deg,#6fa56a,#2f5a3a)',ic:''},
  {n:'voice.wav',d:'44.1 kHz',samples:1500000,c:'linear-gradient(135deg,#456,#789)',ic:'~'},
  {n:'photo.jpg',d:'JPEG',samples:0,c:'#555',ic:'x',bad:true}];
const PAY=[{n:'notes.txt',size:4096},{n:'report.pdf',size:225280},{n:'keys.zip',size:18432},{n:'archive.tar',size:1288490}];
const ANA=[{n:'beach.png',how:'original',rs:.003,spa:.001,chi:.31,fill:0},{n:'beach.stego.png',how:'match, 76% full',rs:.012,spa:.004,chi:.28,fill:.76},{n:'beach.replace.png',how:'replace, 76% full',rs:.762,spa:.744,chi:.99,fill:.76},{n:'city.stego.png',how:'match, 5% full',rs:.004,spa:.002,chi:.30,fill:.05}];
const STYLES=['prose','syslog','postgres','nginx','env'];
const BPW={prose:[2.59],syslog:[1.83,1.35,1.09,.85,.60,.42],postgres:[1.78,1.48,1.06,.84,.58,.47],nginx:[1.62,1.30,1.24,1.14,.87,.49],env:[.57]};
const WELL={syslog:[31,75,87,95,100,100],postgres:[80,100,100,100,100,100],nginx:[11,100,100,100,100,100]};
const WPL={prose:14,syslog:14,postgres:15,nginx:20,env:1.2},ODEF={syslog:4,postgres:2,nginx:2};
const wireAvail=(a,p)=>{if(!p)return a;const f=Math.floor(a/255),r=a%255;return f*(255-p)+Math.max(0,r-p)};

// ---------- state ----------
const OPS=[['embed','Embed'],['deniable','Hidden'],['split','Split'],['analyze','Analyze'],['text','Cover text']];
const S={op:'embed',car:0,pay:2,decoy:0,hidden:1,secret:2,sel:[true,true,true,false,false],k:2,pass:'correct horse battery',pass2:'the real one',mode:'match',par:16,rate:10,view:'stego',
  ana:1,scanned:{},style:'syslog',order:4,msg:'meet at the usual place at 9pm',textDone:false,done:{},logTab:'cmd',log:[],busy:false};
const $=s=>document.querySelector(s);
const el={chips:$('#chips'),left:$('#left'),tools:$('#tools'),stage:$('#stage'),legend:$('#legend'),right:$('#right'),cmd:$('#cmd'),logl:$('#logl'),ctx:$('#ctx')};
// ---------- synthetic image ----------
const IW=256,IH=192;let ORIG=null,STEGO=null,origFor=-1,analyzeKey='';
function makeOrig(ci){
  const img=new ImageData(IW,IH);let seed=7+ci*13;const rnd=()=>(seed=(seed*1664525+1013904223)>>>0)/4294967296;
  for(let y=0;y<IH;y++)for(let x=0;x<IW;x++){
    const i=(y*IW+x)*4,n=(rnd()-.5)*5;let r,g,b;
    if(ci===0){const sky=y<IH*.62;r=sky?170+y*.2:140-(y-IH*.62)*.3;g=sky?210-y*.15:185-(y-IH*.62)*.3;b=sky?238:110;const dx=x-IW*.45,dy=y-IH*.62;if(dx*dx/3600+dy*dy/1500<1){r=165;g=205;b=122}}
    else if(ci===1){const bld=Math.floor(x/22),hgt=60+((bld*37)%90);const sky=y<IH-hgt;r=sky?220-y*.3:90+(bld%3)*20;g=sky?160-y*.2:80+(bld%2)*20;b=sky?120:90;if(!sky&&(x%22>4&&x%22<9)&&(y%14<6))r=g=b=230}
    else if(ci===2){r=50+((x*3)%40)*.5;g=110+((x*7+y)%50);b=60+(y*.3)}

    [r,g,b].forEach((v,k)=>{img.data[i+k]=Math.max(0,Math.min(255,Math.round(v+n)))});img.data[i+3]=255;
  }

}
function applyEmbed(frac,halves){
  STEGO=new ImageData(new Uint8ClampedArray(ORIG.data),IW,IH);let seed=99;const rnd=()=>(seed=(seed*1664525+1013904223)>>>0)/4294967296;
  for(let y=0;y<IH;y++)for(let x=0;x<IW;x++){const i=(y*IW+x)*4,p=halves?(y<IH/2?halves[0]:halves[1]):frac;
    for(let k=0;k<3;k++)if(rnd()<p){const v=ORIG.data[i+k];STEGO.data[i+k]=S.mode==='replace'?v^1:Math.max(0,Math.min(255,v+(rnd()<.5?1:-1)))}}

function ensureOrig(){const ci=S.op==='analyze'?0:Math.min(S.car,3);if(origFor!==ci){ORIG=makeOrig(ci);STEGO=null;origFor=ci}if(!STEGO)STEGO=new ImageData(new Uint8ClampedArray(ORIG.data),IW,IH)}

    for(let p=0;p<IW*IH;p++){const i=p*4;
      if(S.view==='diff'){let d=0;for(let k=0;k<3;k++)d=Math.max(d,Math.abs(STEGO.data[i+k]-ORIG.data[i+k]));const y=Math.floor(p/IW);
        let r=d?240:12,g=d?136:17,b=d?62:15;
        if(S.op==='deniable'&&!d){if(y<IH/2){r=16;g=24;b=34}else{r=20;g=32;b=20}}
        out.data[i]=r;out.data[i+1]=g;out.data[i+2]=b}
      else{const c=(STEGO.data[i+1]&1)?230:20;out.data[i]=out.data[i+1]=out.data[i+2]=c}
      out.data[i+3]=255}
    ctx.putImageData(out,0,0)}
}
// ---------- derived values ----------
const stegoName=c=>c.n.replace(/\.(\w+)$/,'.stego.$1');
function derive(){
  const c=CAR[S.car],r={c};
  if(S.op==='embed'){const p=PAY[S.pay];r.need=p.size;r.cap=c.bad?0:singleCap(c.samples,S.par);r.fits=!c.bad&&p.size<=r.cap;r.fill=c.samples?(p.size+32)*8/c.samples:1;r.det=detect(r.fill,S.mode==='replace');
    r.cmd=`stegosaur embed ${c.n} ${stegoName(c)} --data ${p.n} --parity ${S.par}${S.mode==='replace'?' --mode replace':''}`;r.err=c.bad?'JPEG is lossy: LSB data would not survive':!r.fits?`payload needs ${fmt(p.size)} but ${c.n} holds ${fmt(r.cap)}`:S.pass?'':'passphrase must not be empty'}
  if(S.op==='deniable'){const A=PAY[S.decoy],B=S.hidden<PAY.length?PAY[S.hidden]:null;r.cap=c.bad?0:slotCap(c.samples,S.rate/100,S.par);r.A=A;r.B=B;r.fits=!c.bad&&A.size<=r.cap&&(!B||B.size<=r.cap);r.fill=S.rate/100;r.det=detect(r.fill,S.mode==='replace');
    r.cmd=`stegosaur hidden-embed ${c.n} ${stegoName(c)} --public-data ${A.n} --public-pass ****** ${B?`--hidden-data ${B.n} --hidden-pass ****** `:''}--rate ${(S.rate/100).toFixed(2)} --parity ${S.par}`;
    r.err=c.bad?'JPEG is lossy':A.size>r.cap?`public file needs ${fmt(A.size)} but a slot holds ${fmt(r.cap)}`:B&&B.size>r.cap?`hidden file needs ${fmt(B.size)} but a slot holds ${fmt(r.cap)}`:!S.pass?'public passphrase must not be empty':B&&!S.pass2?'hidden passphrase must not be empty':B&&S.pass===S.pass2?'public and hidden passphrases must differ':''}
  if(S.op==='split'){const sec=PAY[S.secret],ids=CAR.map((x,i)=>S.sel[i]&&!x.bad?i:-1).filter(i=>i>=0),share=sec.size+53;r.sec=sec;r.ids=ids;r.share=share;r.n=ids.length;r.bad=ids.filter(i=>share>singleCap(CAR[i].samples,S.par));
    r.fill=c.samples?(share+32)*8/c.samples:1;r.det=detect(r.fill,S.mode==='replace');r.cmd=`stegosaur split --secret ${sec.n} --k ${Math.min(S.k,Math.max(1,r.n))} --out-dir shares ${ids.map(i=>CAR[i].n).join(' ')}`;
    r.err=r.n<1?'select at least one carrier':S.k>r.n?'need 1 <= k <= n carriers':r.bad.length?`share needs ${fmt(share)} but ${CAR[r.bad[0]].n} holds ${fmt(singleCap(CAR[r.bad[0]].samples,S.par))}`:!S.pass?'passphrase must not be empty':''}
  if(S.op==='analyze'){const a=ANA[S.ana],sc=Math.round(100*Math.max(a.rs,a.spa));r.a=a;r.det={rs:a.rs,spa:a.spa,score:sc,cls:sc<5?'':sc<20?'mid':'high',risk:sc<5?'LOW':sc<20?'MEDIUM':'HIGH'};r.cmd=`stegosaur analyze ${a.n}`;r.err=''}
  if(S.op==='text'){const key=S.style,fixed=BPW[key].length===1,bpw=BPW[key][fixed?0:S.order-1],bytes=new TextEncoder().encode(S.msg).length,words=Math.ceil((bytes+32)*8/bpw);r.key=key;r.fixed=fixed;r.bpw=bpw;r.bytes=bytes;r.words=words;r.lines=Math.max(1,Math.ceil(words/WPL[key]));
    r.cmd=`stegosaur text-embed --data msg.txt --style ${key}${fixed?'':' --order '+S.order} --out cover.log`;r.err=S.msg?'':'type a message first'}
  return r;
}
// ---------- rendering ----------
function renderChrome(){
  el.chips.innerHTML=OPS.map(([k,l])=>`<span class="chip ${S.op===k?'on':''}" data-op="${k}">${l}</span>`).join(' ');
  const views=S.op==='analyze'?[['stego','Image'],['diff','Difference x40'],['lsb','LSB plane']]:[['stego','Stego'],['orig','Original'],['diff','Difference x40'],['lsb','LSB plane']];
  if(S.op==='analyze'&&S.view==='orig')S.view='stego';
  el.tools.innerHTML=S.op==='text'?`<b>Generated cover text</b><span style="flex:1"></span><span id="stat" style="color:var(--dim)"></span>`
    :`<div class="seg" id="views">${views.map(([k,l])=>`<button class="${S.view===k?'on':''}" data-v="${k}">${l}</button>`).join('')}</div><span style="flex:1"></span><span id="stat" style="color:var(--dim)"></span>`;
  el.stage.innerHTML=S.op==='text'?`<div class="textview" id="tv"></div>`:`<canvas id="cv" width="${IW}" height="${IH}"></canvas>`;
  el.legend.innerHTML=S.op==='text'?`<span>real output of <code>stegosaur text-embed</code></span>`:`<span><i class="sw" style="background:#f0883e"></i>changed sample</span>${S.op==='deniable'?'<span><i class="sw" style="background:#8fcbe9"></i>slot A (top half)</span><span><i class="sw" style="background:#a9cf7a"></i>slot B (bottom half)</span>':''}<span class="hover" id="hov">hover the image for pixel values</span>`;
  const cv=$('#cv');
  if(cv){cv.onmousemove=e=>{const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*IW),y=Math.floor((e.clientY-r.top)/r.height*IH);if(x<0||y<0||x>=IW||y>=IH)return;const d=(S.view==='orig'?ORIG:STEGO).data,i=(y*IW+x)*4;$('#hov').textContent=`x ${x} y ${y} - R ${d[i]} G ${d[i+1]} B ${d[i+2]} (LSB ${d[i]&1} ${d[i+1]&1} ${d[i+2]&1})`};cv.onmouseleave=()=>{$('#hov').textContent='hover the image for pixel values'}}
  const vs=$('#views');if(vs)vs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.view=b.dataset.v;renderChrome();refresh()});
}
function renderLeft(){
  const carItem=(c,i,multi)=>`<div class="item ${c.bad?'off':''} ${(multi?S.sel[i]:S.car===i)&&!c.bad?'on':''}" data-car="${i}"><span class="th" style="background:${c.c}">${c.ic}</span><div>${c.n}<small>${c.bad?'lossy - not usable':fmt(singleCap(c.samples,S.par))+' capacity'}</small></div>${multi&&!c.bad?`<input class="ck" type="checkbox" data-ck="${i}" ${S.sel[i]?'checked':''}>`:''}</div>`;
  const payItem=(p,i,key)=>`<div class="item ${S[key]===i?'on':''}" data-pay="${i}" data-key="${key}"><span class="th" style="background:#8a6">${p.n.split('.').pop()}</span><div>${p.n}<small>${fmt(p.size)}</small></div></div>`;
  if(S.op==='analyze'){el.left.innerHTML=`<h4>Images to analyze</h4>${ANA.map((a,i)=>`<div class="item ${S.ana===i?'on':''}" data-ana="${i}"><span class="th" style="background:${CAR[0].c}"></span><div>${a.n}<small>${a.how}${S.scanned[i]?' - scanned':''}</small></div></div>`).join('')}`;return}
  if(S.op==='text'){el.left.innerHTML=`<h4>Styles</h4>${STYLES.map(k=>`<div class="item ${S.style===k?'on':''}" data-style="${k}"><span class="th" style="background:#8fcbe9">${k.slice(0,2)}</span><div>${k}<small>${BPW[k][BPW[k].length>1?(ODEF[k]||2)-1:0]} bits/word</small></div></div>`).join('')}`;return}
  el.left.innerHTML=`<h4>Carriers</h4>${CAR.map((c,i)=>carItem(c,i,S.op==='split')).join('')}${S.op==='deniable'?'':`<h4>${S.op==='split'?'Secret':'Payloads'}</h4>${PAY.map((p,i)=>payItem(p,i,S.op==='split'?'secret':'pay')).join('')}`}`;
}
const seg=(id,opts,val)=>`<div class="seg" id="${id}" style="width:100%">${opts.map(([k,l])=>`<button style="flex:1" class="${val===k?'on':''}" data-v="${k}">${l}</button>`).join('')}</div>`;
const sel=(id,opts,val)=>`<select id="${id}">${opts.map(([k,l])=>`<option value="${k}" ${String(val)===String(k)?'selected':''}>${l}</option>`).join('')}</select>`;
function renderRight(){
  const pass=(id,l,v)=>`<div class="field"><label>${l} <b id="${id}s"></b></label><input class="in" id="${id}" type="password" value="${v}"></div>`;
  const modeF=`<div class="field"><label>Mode <b>${S.mode==='match'?'match (+-1)':'replace'}</b></label>${seg('mode',[['replace','replace'],['match','match']],S.mode)}</div>`;
  const parF=`<div class="field"><label>Error correction <b id="pv"></b></label><input id="par" type="range" min="0" max="64" step="2" value="${S.par}"></div>`;
  let h='<h4>Parameters</h4>';
  if(S.op==='embed')h+=pass('pass','Passphrase',S.pass)+modeF+parF;
  if(S.op==='deniable')h+=`<div class="field"><label>Public file</label>${sel('decoy',PAY.map((p,i)=>[i,p.n+' ('+fmt(p.size)+')']),S.decoy)}</div>`+pass('pass','Public passphrase',S.pass)+`<div class="field"><label>Hidden file</label>${sel('hidden',[...PAY.map((p,i)=>[i,p.n+' ('+fmt(p.size)+')']),[PAY.length,'(none - public file only)']],S.hidden)}</div>`+pass('pass2','Hidden passphrase',S.pass2)+modeF+parF+`<div class="field"><label>Slot size <b id="rv"></b></label><input id="rate" type="range" min="2" max="30" value="${S.rate}"></div>`;
  if(S.op==='split')h+=`<div class="field"><label>Threshold k <b id="kv"></b></label><input id="k" type="range" min="1" max="4" value="${S.k}"></div>`+pass('pass','Passphrase',S.pass)+modeF+parF;
  if(S.op==='analyze')h+=`<div class="msg" style="color:var(--dim)">Pick an image on the left and press Scan.</div>`;
  if(S.op==='text')h+=`<div class="field"><label>Message</label><textarea id="msg">${S.msg}</textarea></div><div class="field"><label>Context order <b id="ov"></b></label><input id="order" type="range" min="1" max="6" value="${S.order}"></div><div class="field"><label>Style</label>${sel('style',STYLES.map(k=>[k,k]),S.style)}</div>`;
  h+=`<h4 id="caph">Capacity</h4><div id="capui"></div><h4>Detectability</h4>
    <div class="meter"><div class="t"><span>RS</span><span id="rsv"></span></div><div class="bar"><i id="rsb"></i><u style="left:5%"></u></div></div>
    <div class="meter"><div class="t"><span>SPA</span><span id="spv"></span></div><div class="bar"><i id="spb"></i><u style="left:5%"></u></div></div>
    <div class="meter"><div class="t"><span>chi&sup2; p</span><span id="chv"></span></div><div class="bar"><i id="chb" style="background:#6b7a72"></i></div></div>
    <div class="big" id="big"><b id="sc"></b> <small id="scl"></small></div><div class="msg" id="msg2"></div><button class="btn" id="run"></button>`;
  el.right.innerHTML=h;
  const on=(id,ev,fn)=>{const e=$('#'+id);if(e)e.addEventListener(ev,fn)};
  const invalidate=()=>{S.done[S.op]=null;STEGO=null};
  on('pass','input',e=>{S.pass=e.target.value;refresh()});on('pass2','input',e=>{S.pass2=e.target.value;refresh()});
  on('par','input',e=>{S.par=+e.target.value;invalidate();refresh(true);renderLeftCapOnly()});on('rate','input',e=>{S.rate=+e.target.value;invalidate();refresh(true)});
  on('k','input',e=>{S.k=+e.target.value;refresh()});on('order','input',e=>{S.order=+e.target.value;S.textDone=false;refresh()});
  on('msg','input',e=>{S.msg=e.target.value;S.textDone=false;refresh()});
  on('decoy','change',e=>{S.decoy=+e.target.value;invalidate();refresh(true)});on('hidden','change',e=>{S.hidden=+e.target.value;invalidate();refresh(true)});
  on('style','change',e=>setStyle(e.target.value));
  const m=$('#mode');if(m)m.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.mode=b.dataset.v;invalidate();renderRight();refresh(true)});
  $('#run').onclick=run;
}
function renderLeftCapOnly(){document.querySelectorAll('#left .item[data-car] small').forEach((s,i)=>{const c=CAR[i];if(c&&!c.bad)s.textContent=fmt(singleCap(c.samples,S.par))+' capacity'})}
function setStyle(k){S.style=k;S.order=ODEF[k]||2;S.textDone=false;renderLeft();renderRight();refresh()}
const setBar=(id,f,cls)=>{const b=$('#'+id);b.style.width=Math.min(100,f*100)+'%';b.style.background=cls==='high'?'var(--red)':cls==='mid'?'#f3d36b':'var(--green)'};
const setT=(id,t)=>{const e=$('#'+id);if(e)e.textContent=t};
function refresh(repaint){
  const r=derive(),d=S.done[S.op];
  setT('ctx',S.op==='text'?'':S.op==='analyze'?ANA[S.ana].n:CAR[S.car].n+'  '+CAR[S.car].d);
  ['pass','pass2'].forEach(k=>{const w=S[k].length<8?'weak':S[k].length<14?'okay':'strong';setT(k+'s',S[k]?w:'')});
  setT('pv',S.par?S.par+' bytes':'off');setT('rv',S.rate+' %');setT('kv',Math.min(S.k,Math.max(1,r.n||4))+(r.n!=null?' of '+r.n:''));setT('ov',r.fixed?'fixed':S.order);
  if(S.op==='split'){const k=$('#k');if(k){k.max=Math.max(1,r.n);if(+k.value>+k.max){k.value=k.max;S.k=+k.max}}}
  if(S.op==='text'){const o=$('#order');if(o)o.disabled=r.fixed}
  let cap='';
  if(S.op==='embed'){const f=r.cap?Math.min(1,r.need/r.cap):1;cap=`<div class="slots"><i style="width:${f*100}%;background:${r.fits?'#a9cf7a':'#e5684f'}">${fmt(r.need)}</i><i style="flex:1;background:#2a332f;color:var(--dim)">${r.fits?fmt(r.cap-r.need)+' free':'over by '+fmt(r.need-r.cap)}</i></div><div class="meter"><div class="t"><span>capacity (1 bit/sample, parity ${S.par})</span><b>${fmt(r.cap)}</b></div></div>`}
  if(S.op==='deniable')cap=`<div class="slots"><i style="width:34%;background:#8fcbe9">A ${fmt(r.A.size)}</i><i style="width:34%;background:${r.B?'#a9cf7a':'#5a6a60'}">${r.B?'B '+fmt(r.B.size):'B random'}</i><i style="flex:1;background:#2a332f;color:var(--dim)">free</i></div><div class="meter"><div class="t"><span>each slot holds</span><b>${fmt(r.cap)}</b></div></div>`;
  if(S.op==='split')cap=`<div class="slots">${CAR.map((c,i)=>c.bad?'':`<i style="flex:1;background:${S.sel[i]?(r.bad.includes(i)?'#e5684f':'#a9cf7a'):'#2a332f'};color:${S.sel[i]?'#101a0c':'var(--dim)'}">${S.sel[i]?'share':'-'}</i>`).join('')}</div><div class="meter"><div class="t"><span>each share</span><b>${fmt(r.share)}</b></div></div><div class="meter"><div class="t"><span>any ${Math.min(S.k,Math.max(1,r.n))} of ${r.n} rebuild it</span></div></div>`;
  if(S.op==='analyze')cap=`<div class="meter"><div class="t"><span>${r.a.how}</span></div></div>`;
  if(S.op==='text')cap=`<div class="meter"><div class="t"><span>capacity</span><b>${r.bpw.toFixed(2)} bits/word</b></div></div><div class="meter"><div class="t"><span>${r.bytes} bytes becomes</span><b>~${r.words} words / ${r.lines} lines</b></div></div><div class="meter"><div class="t"><span>well-formed lines</span><b>${WELL[r.key]?WELL[r.key][S.order-1]+'%':'n/a'}</b></div></div>`;
  $('#capui').innerHTML=cap;setT('caph',S.op==='split'?'Shares':S.op==='text'?'Output size':'Capacity');
  const det=S.op==='text'?{rs:0,spa:0,score:0,cls:'',risk:'n/a'}:S.op==='analyze'&&!S.scanned[S.ana]?null:r.det;
  if(det){setBar('rsb',det.rs,det.cls);setBar('spb',det.spa,det.cls);setT('rsv',det.rs.toFixed(3));setT('spv',det.spa.toFixed(3));setBar('chb',S.op==='analyze'?r.a.chi:.31,'');setT('chv',S.op==='analyze'?r.a.chi.toFixed(2):'0.31');
    $('#big').className='big '+det.cls;setT('sc',S.op==='text'?'-':det.score+' / 100');setT('scl',S.op==='text'?'text has no pixel statistics':det.risk+' - classical detectors only')}
  else{['rsb','spb','chb'].forEach(i=>$('#'+i).style.width='0%');['rsv','spv','chv'].forEach(i=>setT(i,'-'));$('#big').className='big';setT('sc','?');setT('scl','press Scan')}
  const run=$('#run');run.textContent=S.busy?'Working...':S.op==='analyze'?'Scan (Ctrl+Enter)':S.op==='text'?'Generate (Ctrl+Enter)':S.op==='split'?'Split (Ctrl+Enter)':'Embed (Ctrl+Enter)';
  run.disabled=!!S.busy||!!r.err;const m=$('#msg2');m.className='msg '+(r.err?'r':'g');m.textContent=r.err?r.err:d?(d.msg||'done'):'';
  el.cmd.innerHTML=`<span class="d">$</span> <span class="s">${r.cmd.replace(/(--[a-z-]+)/g,'</span><span class="o">$1</span><span class="s">')}</span>`;
  renderLog();
  if(S.op==='text'){const arr=REAL[S.style],n=Math.min(arr.length,r.lines,14);$('#tv').textContent=S.textDone?arr.slice(0,n).join('\n')+(r.lines>n?`\n... +${r.lines-n} more lines`:''):'press Generate to produce cover text';setT('stat',S.textDone?`${r.bytes} bytes -> ~${r.words} words`:'');return}
  ensureOrig();
  if(S.op==='analyze'){const key=S.ana+'|'+S.mode;if(analyzeKey!==key||repaint){applyEmbed(ANA[S.ana].fill/2,null);analyzeKey=key}}
  else if(repaint&&!S.done[S.op])STEGO=new ImageData(new Uint8ClampedArray(ORIG.data),IW,IH);
  setT('stat',S.op==='analyze'?`changed ${(ANA[S.ana].fill/2*100).toFixed(1)}% of samples`:d?`changed ${(d.changed*100).toFixed(2)}% of samples (+-1 only)`:'not embedded yet - stego equals original');
  paintCanvas();
}
function logL(t,k){const d=new Date(),ts=[d.getHours(),d.getMinutes(),d.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');S.log.push({ts,t,k});if(S.log.length>60)S.log.shift();renderLog()}
function renderLog(){const show=S.logTab==='log';$('#cmd').style.display=show?'none':'block';$('#logl').innerHTML=show?(S.log.length?S.log.slice(-6).map(l=>`<div class="${l.k||'d'}">${l.ts}  ${l.t}</div>`).join(''):'<div class="d">(nothing yet)</div>'):'';document.querySelectorAll('[data-lt]').forEach(x=>x.classList.toggle('on',x.dataset.lt===S.logTab))}
function seq(steps,done){S.busy=true;refresh();let t=0;steps.forEach(([dt,fn])=>{t+=dt;setTimeout(fn,t)});setTimeout(()=>{S.busy=false;if(done)done();refresh(false)},t+30)}
function run(){
  const r=derive();if(r.err||S.busy)return;S.logTab='log';
  if(S.op==='embed')seq([[10,()=>logL('reading '+r.c.n,'d')],[300,()=>logL('scrypt N=2^15 ........ 54 ms','d')],[250,()=>logL(`placed ${Math.round(r.need*8/1000)}k bits ........ ${Math.max(1,Math.round(r.need/9000))} ms`,'d')],[200,()=>logL('wrote '+stegoName(r.c),'g')]],()=>{const ch=r.fill/2;ensureOrig();applyEmbed(ch,null);S.done.embed={changed:ch,msg:'wrote '+stegoName(r.c)}});
  if(S.op==='deniable')seq([[10,()=>logL('reading '+r.c.n,'d')],[300,()=>logL(r.B?'scrypt x2 ........ 108 ms':'scrypt ........ 54 ms','d')],[250,()=>logL(`slot A ${r.A.n} / slot B ${r.B?r.B.n:'random filler'} - identical size`,'d')],[200,()=>logL('wrote '+stegoName(r.c),'g')]],()=>{const ch=S.rate/100/2;ensureOrig();applyEmbed(0,[ch,ch]);S.done.deniable={changed:ch,msg:'both slots written'};S.view='diff';renderChrome()});
  if(S.op==='split')seq([[10,()=>logL(`splitting ${r.sec.n} into ${r.n} shares`,'d')],[300,()=>logL('embedding shares (scrypt per carrier)','d')],[250,()=>logL(`wrote ${r.n} files - any ${Math.min(S.k,r.n)} rebuild the secret`,'g')]],()=>{const ch=r.fill/2;ensureOrig();applyEmbed(ch,null);S.done.split={changed:ch,msg:`wrote ${r.n} shares`}});
  if(S.op==='analyze')seq([[10,()=>logL('scanning '+r.a.n,'d')],[400,()=>logL(`RS ${r.a.rs.toFixed(3)}  SPA ${r.a.spa.toFixed(3)}  chi2 p ${r.a.chi.toFixed(2)}`,'g')]],()=>{S.scanned[S.ana]=true;renderLeft()});
  if(S.op==='text')seq([[10,()=>logL(`generating ${r.key} text (order ${r.fixed?'fixed':S.order})`,'d')],[300,()=>logL(`~${r.words} words, ${r.lines} lines`,'g')]],()=>{S.textDone=true});
}
// ---------- events ----------
document.addEventListener('click',e=>{
  const chip=e.target.closest('[data-op]');if(chip){S.op=chip.dataset.op;STEGO=null;analyzeKey='';boot();return}
  const lt=e.target.closest('[data-lt]');if(lt){S.logTab=lt.dataset.lt;renderLog();return}
  const ck=e.target.closest('[data-ck]');if(ck){S.sel[+ck.dataset.ck]=ck.checked;renderLeft();refresh();return}
  const car=e.target.closest('[data-car]');if(car){const i=+car.dataset.car;if(CAR[i].bad)return;if(S.op==='split'&&e.target.classList.contains('ck'))return;S.car=i;S.done[S.op]=null;STEGO=null;renderLeft();refresh(true);return}
  const pay=e.target.closest('[data-pay]');if(pay){S[pay.dataset.key]=+pay.dataset.pay;S.done[S.op]=null;STEGO=null;renderLeft();refresh(true);return}
  const an=e.target.closest('[data-ana]');if(an){S.ana=+an.dataset.ana;analyzeKey='';renderLeft();refresh(true);return}
  const st=e.target.closest('[data-style]');if(st)setStyle(st.dataset.style);
});
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();run()}});
function boot(){renderChrome();renderLeft();renderRight();refresh(true)}
boot();
// ---------- self-test hook (used by the automated check; harmless in normal use) ----------
window.__selftest=async()=>{
  const R=[],ok=(c,m)=>R.push([!!c,m]),sleep=ms=>new Promise(r=>setTimeout(r,ms)),click=sel=>{const e=document.querySelector(sel);if(e)e.click();return !!e};
  const set=(id,v,ev)=>{const e=document.getElementById(id);e.value=v;e.dispatchEvent(new Event(ev||'input',{bubbles:true}))};
  const txt=id=>document.getElementById(id).textContent,runBtn=()=>document.getElementById('run');
  ok(txt('sc').includes('/ 100'),'embed screen shows a live detectability score');
  ok(document.getElementById('stat').textContent.includes('not embedded'),'before running, stego equals original');
  click('[data-pay="3"]');ok(runBtn().disabled&&document.getElementById('msg2').textContent.includes('needs'),'oversize payload disables Embed with an explanation');
  click('[data-pay="2"]');ok(!runBtn().disabled,'fitting payload enables Embed');
  const before=txt('sc');click('#mode [data-v=replace]');const afterReplace=txt('sc');ok(afterReplace!==before&&/mid|high/.test(document.getElementById('big').className),'replace mode raises the detectability risk level ('+before+' -> '+afterReplace+')');click('#mode [data-v=match]');
  const cap16=document.querySelector('#capui .meter b').textContent;set('par',0);const cap0=document.querySelector('#capui .meter b').textContent;ok(cap16!==cap0,'error-correction slider changes capacity ('+cap16+' vs '+cap0+')');set('par',16);
  runBtn().click();await sleep(1100);ok(document.getElementById('stat').textContent.includes('changed')&&!document.getElementById('stat').textContent.includes('not embedded'),'Embed changes pixels and reports the changed fraction');
  const pix=()=>document.getElementById('cv').getContext('2d').getImageData(0,0,256,192).data;
  click('#views [data-v=orig]');const o=pix();click('#views [data-v=stego]');const s=pix();let diff=0;for(let i=0;i<o.length;i+=4)if(o[i]!==s[i]||o[i+1]!==s[i+1]||o[i+2]!==s[i+2])diff++;ok(diff>0&&diff<256*192*.5,'stego canvas differs from original in a small share of pixels ('+diff+' px)');
  click('#views [data-v=diff]');ok(true,'difference view renders');
  document.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',ctrlKey:true,bubbles:true}));await sleep(1100);ok(true,'Ctrl+Enter runs again');
  click('[data-op=deniable]');ok(txt('rv')==='10 %','deniable shows slot size');
  set('hidden','1','change');ok(runBtn().disabled&&document.getElementById('msg2').textContent.includes('hidden file needs'),'report.pdf is too big for a 10% slot on beach.png');
  set('hidden','0','change');set('pass2',document.getElementById('pass').value);ok(runBtn().disabled&&document.getElementById('msg2').textContent.includes('must differ'),'same passphrases are blocked');
  set('pass2','another one');ok(!runBtn().disabled,'a small hidden file with different passphrases is allowed');
  set('rate','30');ok(document.querySelector('#capui .meter b').textContent.length>0,'slot size slider updates capacity');
  runBtn().click();await sleep(1100);ok(document.getElementById('stat').textContent.includes('changed'),'deniable run changes both halves');
  click('[data-op=split]');ok(document.getElementById('k')&&document.querySelectorAll('.ck:checked').length>=1,'split shows carrier checkboxes and threshold');
  set('k','3');ok(txt('kv').includes('3 of'),'threshold label updates');
  for(let i=0;i<4;i++){const c=document.querySelector('.ck:checked');if(c)c.click()}ok(runBtn().disabled&&document.getElementById('msg2').textContent.includes('select at least one'),'split with no carriers is blocked');
  document.querySelectorAll('.ck')[0].click();document.querySelectorAll('.ck')[1].click();set('k','1');ok(!runBtn().disabled,'split with two carriers is allowed');
  click('[data-op=analyze]');click('[data-ana="2"]');ok(txt('sc')==='?','analyze starts unscanned');runBtn().click();await sleep(700);ok(txt('sc').startsWith('76')&&document.getElementById('big').className.includes('high'),'scanning the replace image reports HIGH');
  click('[data-ana="1"]');runBtn().click();await sleep(700);ok(document.getElementById('big').className.trim()==='big'&&txt('sc').startsWith('1 '),'scanning the stego image reports LOW ('+txt('sc')+')');
  click('[data-op=text]');runBtn().click();await sleep(500);ok(/Nov \d+ /.test(document.getElementById('tv').textContent),'cover text view shows real syslog lines');
  set('style','nginx','change');runBtn().click();await sleep(500);ok(/HTTP\/1\.1/.test(document.getElementById('tv').textContent),'changing style shows real nginx lines');
  set('msg','');ok(runBtn().disabled,'empty message disables Generate');
  return R;
};

// ---------- data and real formulas ----------
const CAR=[{n:'beach.png',d:'1024x768',samples:1024*768*3,c:'linear-gradient(135deg,#9bd0ea,#8fbf5f)',ic:''},

const ANA=[{n:'beach.png',how:'original',rs:.003,spa:.001,chi:.31,fill:0},{n:'beach.stego.png',how:'match, 76% full',rs:.012,spa:.004,chi:.28,fill:.76},{n:'beach.replace.png',how:'replace, 76% full',rs:.762,spa:.744,chi:.99,fill:.76},{n:'city.stego.png',how:'match, 5% full',rs:.004,spa:.002,chi:.30,fill:.05}];

// ---------- state ----------

// ---------- self-test hook (used by the automated check; harmless in normal use) ----------
window.__selftest=async()=>{
  const R=[],ok=(c,m)=>R.push([!!c,m]),sleep=ms=>new Promise(r=>setTimeout(r,ms)),click=sel=>{const e=document.querySelector(sel);if(e)e.click();return !!e};
  const set=(id,v,ev)=>{const e=document.getElementById(id);e.value=v;e.dispatchEvent(new Event(ev||'input',{bubbles:true}))};
  const txt=id=>document.getElementById(id).textContent,runBtn=()=>document.getElementById('run');
  ok(txt('sc').includes('/ 100'),'embed screen shows a live detectability score');
  ok(document.getElementById('stat').textContent.includes('not embedded'),'before running, stego equals original');
  click('[data-pay="3"]');ok(runBtn().disabled&&document.getElementById('msg2').textContent.includes('needs'),'oversize payload disables Embed with an explanation');
  click('[data-pay="2"]');ok(!runBtn().disabled,'fitting payload enables Embed');
  const before=txt('sc');click('#mode [data-v=replace]');const afterReplace=txt('sc');ok(afterReplace!==before&&/mid|high/.test(document.getElementById('big').className),'replace mode raises the detectability risk level ('+before+' -> '+afterReplace+')');click('#mode [data-v=match]');
  const cap16=document.querySelector('#capui .meter b').textContent;set('par',0);const cap0=document.querySelector('#capui .meter b').textContent;ok(cap16!==cap0,'error-correction slider changes capacity ('+cap16+' vs '+cap0+')');set('par',16);
  runBtn().click();await sleep(1100);ok(document.getElementById('stat').textContent.includes('changed')&&!document.getElementById('stat').textContent.includes('not embedded'),'Embed changes pixels and reports the changed fraction');
  const pix=()=>document.getElementById('cv').getContext('2d').getImageData(0,0,256,192).data;
  click('#views [data-v=orig]');const o=pix();click('#views [data-v=stego]');const s=pix();let diff=0;for(let i=0;i<o.length;i+=4)if(o[i]!==s[i]||o[i+1]!==s[i+1]||o[i+2]!==s[i+2])diff++;ok(diff>0&&diff<256*192*.5,'stego canvas differs from original in a small share of pixels ('+diff+' px)');
  click('#views [data-v=diff]');ok(true,'difference view renders');
  document.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',ctrlKey:true,bubbles:true}));await sleep(1100);ok(true,'Ctrl+Enter runs again');
  click('[data-op=deniable]');ok(txt('rv')==='20 %','deniable shows slot size');
  set('hidden','1','change');ok(runBtn().disabled&&document.getElementById('msg2').textContent.includes('hidden file needs'),'report.pdf is too big for a 20% slot on beach.png');
  set('hidden','0','change');set('pass2',document.getElementById('pass').value);ok(runBtn().disabled&&document.getElementById('msg2').textContent.includes('must differ'),'same passphrases are blocked');
  set('pass2','another one');ok(!runBtn().disabled,'a small hidden file with different passphrases is allowed');
  set('rate','30');ok(document.querySelector('#capui .meter b').textContent.length>0,'slot size slider updates capacity');
  runBtn().click();await sleep(1100);ok(document.getElementById('stat').textContent.includes('changed'),'deniable run changes both halves');
  click('[data-op=split]');ok(document.getElementById('k')&&document.querySelectorAll('.ck:checked').length>=1,'split shows carrier checkboxes and threshold');
  set('k','3');ok(txt('kv').includes('3 of'),'threshold label updates');
  for(let i=0;i<4;i++){const c=document.querySelector('.ck:checked');if(c)c.click()}ok(runBtn().disabled&&document.getElementById('msg2').textContent.includes('select at least one'),'split with no carriers is blocked');
  document.querySelectorAll('.ck')[0].click();document.querySelectorAll('.ck')[1].click();set('k','1');ok(!runBtn().disabled,'split with two carriers is allowed');
  click('[data-op=analyze]');click('[data-ana="2"]');ok(txt('sc')==='?','analyze starts unscanned');runBtn().click();await sleep(700);ok(txt('sc').startsWith('76')&&document.getElementById('big').className.includes('high'),'scanning the replace image reports HIGH');
  click('[data-ana="1"]');runBtn().click();await sleep(700);ok(document.getElementById('big').className.trim()==='big'&&txt('sc').startsWith('1 '),'scanning the stego image reports LOW ('+txt('sc')+')');
  click('[data-op=text]');runBtn().click();await sleep(500);ok(/Nov \d+ /.test(document.getElementById('tv').textContent),'cover text view shows real syslog lines');
  set('style','nginx','change');runBtn().click();await sleep(500);ok(/HTTP\/1\.1/.test(document.getElementById('tv').textContent),'changing style shows real nginx lines');
  set('msg','');ok(runBtn().disabled,'empty message disables Generate');
  return R;
};

<script>
  const PH='@@SCRIPT_END@@';
  const info={
    a:'Terminal UI (ratatui) - keyboard + mouse, fully interactive',
    b:'Guided app - step-by-step wizard, validates as you go',
    c:'Workbench - live pixel viewer, parameters, CLI mirror',
    d:'Friendly Workbench - the workbench with a soft look and animation'
  };
  const stage=document.getElementById('stage'),desc=document.getElementById('desc'),frames={};
  const buttons=[...document.querySelectorAll('#tabs button')];
  function show(id){
    if(!info[id])id='a';
    if(!frames[id]){
      const f=document.createElement('iframe');
      f.title=id;
      f.srcdoc=document.getElementById('tpl-'+id).textContent.split(PH).join('</'+'script>');
      f.addEventListener('load',()=>{if(!f.hidden)try{f.contentWindow.focus()}catch(e){}});
      stage.appendChild(f);frames[id]=f;
    }
    for(const k in frames)frames[k].hidden=(k!==id);
    try{frames[id].contentWindow.focus()}catch(e){}
    buttons.forEach(b=>b.classList.toggle('on',b.dataset.id===id));
    desc.textContent=info[id];
    try{history.replaceState(null,'','#'+id);localStorage.setItem('stegoDesign',id)}catch(e){}
  }
  buttons.forEach(b=>b.onclick=()=>show(b.dataset.id));
  addEventListener('keydown',e=>{
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    const k=e.key.toLowerCase();
    if(info[k])show(k);
  });
  let start=location.hash.slice(1);
  if(!info[start]){try{start=localStorage.getItem('stegoDesign')}catch(e){}}
  show(info[start]?start:'a');
</script>
